# CROMA-base ensemble member — distill labels + Trädslag frac head.
#
# LAUNCH-READY as of 2026-08-14 — the model↔trainer glue landed (commit
#   6bab76e + fixes). GO: real-weight smoke on a 2080ti passed end to end
#   (dataset → forward_router.family_forward → logits (2,28,H,W) + frac
#   (2,4,H,W) → finite loss → backward). The preflight guard below still
#   fail-fasts if any wiring regresses.
#   Coverage: 6011/7882 tiles have s1_vv_vh (CROMA-complete; the dataset
#   filters to this subset automatically via model_keys).
#
# ΔSAR RETRAIN (v3, 2026-08-17): --enable-delta-sar adds the 2016 clearcut
#   anchor via 2 computed aux channels (ΔVV/ΔVH dB = season γ⁰ − 2016 γ⁰).
#   The pretrained SAR encoder is locked to 2-ch input, so the anchor rides
#   the AUX path, not a third SAR frame. Checkpoints → croma_v3 (the old
#   croma dir is left intact). A PREFLIGHT fails loud unless ≥95% of
#   /cephfs/unified_v2_512 tiles have s1_enrich_v==3 (no partial-enrichment
#   training) AND the ΔSAR code is present in the clone.
#
# CROMA is patch_size=8 → 504 crop is OK (504/8=63). H100 has ample memory;
# the smoke ran at 224px only because the 2080ti (11 GB) OOMs at 504.
# Weights cached at /data/model_cache/CROMA_base.pt; loader also needs
# use_croma.py from github.com/antofuller/CROMA on PYTHONPATH (cloned below).
#
# HEAD (2026-08-14): multi-level UPerNet (ViTUPerNetHead), hooking 4 evenly-
#   spaced blocks of cross_encoder.layers (joint SAR↔optical, 6 blocks) —
#   fairness parity with Prithvi, not a linear probe.
# MEMORY (2026-08-14): request 48Gi (was 80Gi). Measured peak host tree-RSS
#   at bs=8/workers=16/504px = 8.3 GB (dataloader footprint); +CUDA host
#   overhead + margin → 48Gi is ~3× headroom and lets all 3 FM jobs run in
#   parallel under the 250Gi namespace quota (3×48=144 < ~195 available).
apiVersion: batch/v1
kind: Job
metadata:
  name: train-croma-v3
  namespace: prithvi-training-default
  labels: { app: unified-training, dataset: "512", purpose: croma, variant: delta-sar-v3 }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: unified-training, purpose: croma }
    spec:
      activeDeadlineSeconds: 43200
      restartPolicy: Never
      nodeSelector: { accelerator: nvidia-h100 }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - { key: kubernetes.io/hostname, operator: NotIn, values: ["p02r08srv02"] }
      containers:
      - name: trainer
        image: python:3.11-slim
        env:
        - { name: PYTHONUNBUFFERED, value: "1" }
        - { name: HF_HOME, value: "/cephfs/model_cache/hf" }
        - { name: PYTHONPATH, value: "/workspace/CROMA" }
        command: ["/bin/bash","-c"]
        args:
        - |
          set -e
          export PYTHONUNBUFFERED=1
          echo "=== CROMA-base member — distill labels + frac head (28-class) — $(date) ==="

          apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
          pip install --quiet --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu121
          pip install --quiet --no-cache-dir timm numpy scipy scikit-learn huggingface_hub einops

          mkdir -p /workspace && cd /workspace
          git clone --depth 1 https://github.com/antofuller/CROMA.git /workspace/CROMA
          BRANCH=agent/te/opus/nfi-nmd2023-benchmark
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/TobiasEdman/ImintEngine.git imintengine
          cd /workspace/imintengine
          pip install --no-cache-dir -e . || pip install --quiet --no-cache-dir -r requirements.txt
          echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"

          # --- PREFLIGHT: fail loud unless the training-path wiring is real ---
          python - <<'PY'
          import inspect, sys
          from imint.training import unified_dataset as ud
          from imint.fm import forward_router as fr
          from imint.fm.croma_seg import CromaSegmentationModel as C
          fails = []
          if "croma_base" not in ud.UnifiedDataset._SUPPORTED_MODEL_KEYS:
              fails.append("dataset cannot build croma tensors")
          src_train = inspect.getsource(__import__('scripts.train_unified', fromlist=['x']))
          if "model_keys" not in src_train:
              fails.append("train_unified.py never sets model_keys")
          if "s1_vv_vh" not in inspect.getsource(ud):
              fails.append("dataset never emits s1_vv_vh (SAR)")
          fp = inspect.signature(C.forward).parameters
          if "return_fractions" not in fp:
              fails.append("CromaSeg.forward lacks return_fractions/frac head")
          # The per-family forward routing lives in forward_router.family_forward
          # (shared by trainer + evaluate). Assert the CROMA branch routes SAR +
          # optical through the model.
          src_fr = inspect.getsource(fr)
          if 'family == "croma"' not in src_fr or "optical=" not in src_fr:
              fails.append("forward_router never routes sar/optical into CROMA")
          # ΔSAR clone-guard: the delta-channel compute + opt-in must be in the
          # cloned code, else --enable-delta-sar would silently be a no-op.
          if not hasattr(ud, "compute_delta_sar"):
              fails.append("dataset missing compute_delta_sar (ΔSAR not in clone)")
          if "delta_vv" not in inspect.getsource(ud):
              fails.append("dataset never wires delta_vv/delta_vh aux channels")
          from imint.training.config import TrainingConfig as _Cfg
          if "delta_vv" not in _Cfg(enable_delta_sar_channels=True).enabled_aux_names:
              fails.append("config never appends delta_vv/delta_vh when opted in")
          if fails:
              print("PREFLIGHT FAILED — CROMA training path not wired:")
              for f in fails: print("  -", f)
              sys.exit(3)
          print("preflight OK")
          PY

          # --- PREFLIGHT: fail loud on a PARTIAL S1 v3 enrichment ---
          # Never train the ΔSAR retrain on a half-enriched dataset: the delta
          # channels would be zero on every not-yet-v3 tile, poisoning the
          # anchor. Require >=95% of tiles to carry s1_enrich_v==3.
          python - <<'PY'
          import glob, sys
          import numpy as np
          roots = ["/cephfs/unified_v2_512/tiles", "/cephfs/unified_v2_512"]
          tiles = []
          for r in roots:
              tiles = sorted(glob.glob(r + "/*.npz"))
              if tiles:
                  break
          if not tiles:
              print("PREFLIGHT FAILED — no tiles under /cephfs/unified_v2_512"); sys.exit(4)
          n = len(tiles); v3 = 0; with2016 = 0
          for p in tiles:
              try:
                  with np.load(p, allow_pickle=True) as z:
                      if "s1_enrich_v" in z.files and int(z["s1_enrich_v"].item()) == 3:
                          v3 += 1
                      if "s1_vv_vh_2016" in z.files:
                          with2016 += 1
              except Exception:
                  pass
          frac = v3 / n
          print(f"S1 enrichment: {v3}/{n} tiles s1_enrich_v==3 ({frac:.1%}); "
                f"{with2016}/{n} carry s1_vv_vh_2016 ({with2016/n:.1%})")
          if frac < 0.95:
              print(f"PREFLIGHT FAILED — only {frac:.1%} of tiles are s1_enrich_v==3 "
                    f"(<95%). Wait for enrich-s1-season to finish before training.")
              sys.exit(5)
          print("enrichment coverage OK")
          PY

          mkdir -p /cephfs/checkpoints/croma_v3
          cd /cephfs
          python /workspace/imintengine/scripts/train_unified.py \
            --backbone-name croma_base \
            --data-dirs /cephfs/unified_v2_512 \
            --label-dir /cephfs/nmd2023_distill_labels \
            --frac-dir /cephfs/tradslag_fracs \
            --enable-tradslag-head \
            --enable-delta-sar \
            --lambda-frac 1.0 \
            --checkpoint-dir /cephfs/checkpoints/croma_v3 \
            --num-classes 28 \
            --epochs 30 \
            --batch-size 8 \
            --lr 1e-4 \
            --weight-decay 0.35 \
            --loss-type focal_dice \
            --focal-gamma 2.0 \
            --patch-size 504 \
            --img-size 504 \
            --weighting-method sqrt \
            --label-smoothing 0.05 \
            --lovasz-weight 0.3 \
            --patience 20 \
            --num-workers 16 \
            --device cuda
          echo "=== Done: $(date) ==="
        volumeMounts:
        - { mountPath: /cephfs, name: cephfs }
        - { mountPath: /data, name: cephfs }
        - { mountPath: /dev/shm, name: dshm }
        resources:
          requests: { cpu: "16", memory: "48Gi", nvidia.com/gpu: "1" }
          limits:   { cpu: "16", memory: "48Gi", nvidia.com/gpu: "1" }
      volumes:
      - name: cephfs
        persistentVolumeClaim: { claimName: training-data-cephfs }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
