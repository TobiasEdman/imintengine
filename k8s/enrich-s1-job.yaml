apiVersion: batch/v1
kind: Job
metadata:
  name: enrich-s1
  namespace: prithvi-training-default
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 172800  # 48h
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: enricher
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== S1 SAR Enrichment ==="

              apt-get update -qq && apt-get install -y -qq git libgdal-dev gdal-bin > /dev/null 2>&1
              pip install --quiet --no-cache-dir numpy scipy rasterio requests pyproj pyyaml Pillow httpx pystac-client planetary-computer

              mkdir -p /workspace && cd /workspace
              git clone --depth 1 https://github.com/TobiasEdman/ImintEngine.git imintengine
              cd /workspace/imintengine
              pip install --no-cache-dir -e . --no-deps 2>/dev/null || true

              # S1_BACKENDS=mpc: MPC is the verified working path (WarpedVRT
              # over the rotated GRD swath, σ⁰ 100% valid px — verify-s1-fix
              # 2026-08-04). CDSE download 401s (needs a password-grant token,
              # not the client_credentials account — follow-up); skipping it
              # avoids a wasted search+401 per tile. MPC is auth-free and not
              # WAF-limited, so concurrency is fine again.
              python scripts/enrich_tiles_s1.py \
                --data-dir /data/unified_v2_512 \
                --s1-backend cascade \
                --workers 4 \
                --skip-existing

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: S1_BACKENDS
              value: "mpc"
            - name: CDSE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: client_id
                  optional: true
            - name: CDSE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: client_secret
                  optional: true
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: training-data
              mountPath: /data
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-cephfs
