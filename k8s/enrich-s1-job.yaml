apiVersion: batch/v1
kind: Job
metadata:
  name: enrich-s1
  namespace: prithvi-training-default
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 172800  # 48h
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # srv04/srv06 = runc pod-sandbox bug + observed OOM host
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["p02r09srv04", "p02r09srv06"]
      containers:
        - name: enricher
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== S1 SAR Enrichment ==="

              apt-get update -qq && apt-get install -y -qq git libgdal-dev gdal-bin > /dev/null 2>&1
              pip install --quiet --no-cache-dir numpy scipy rasterio requests pyproj pyyaml Pillow httpx pystac-client planetary-computer

              mkdir -p /workspace && cd /workspace
              git clone --depth 1 https://github.com/TobiasEdman/ImintEngine.git imintengine
              cd /workspace/imintengine
              pip install --no-cache-dir -e . --no-deps 2>/dev/null || true

              # Backend pc-rtc (RTC γ⁰, windowed reads) — the script's only
              # backend. The former `cascade` (CDSE → MPC → AWS σ⁰ over
              # GCP-referenced GRD) is retired (task 0113: ellipsoid-height
              # tie points shifted the sea 41–56 m) and refused by the script.
              python scripts/enrich_tiles_s1.py \
                --data-dir /data/unified_v2_512 \
                --s1-backend pc-rtc \
                --workers 2 \
                --skip-existing

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CDSE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: client_id
                  optional: true
            - name: CDSE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: client_secret
                  optional: true
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
            limits:
              cpu: "4"
              memory: "24Gi"
          volumeMounts:
            - name: training-data
              mountPath: /data
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-cephfs
