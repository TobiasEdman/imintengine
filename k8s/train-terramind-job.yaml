# TerraMind v1-base ensemble member — distill labels + Trädslag frac head.
#
# ⚠ NOT LAUNCH-READY as of 2026-08-13. Preflight guard fails the job in
#   seconds if the training-path glue is still missing. See go/no-go report.
#   Blockers (model/trainer glue, not data):
#     1. train_unified.py never sets model_keys; the dataset never emits
#        s1_vv_vh (SAR) — TerraMind needs {"S2L2A": spectral, "S1GRD": s1}.
#     2. trainer.py forward reads only batch["spectral"]; never builds the
#        modality dict TerraMindSegmentationModel.forward(inputs: dict) needs.
#     3. build_segmentation_from_spec's terramind branch does not pass
#        enable_tradslag_head; TerraMindSeg.forward returns a single tensor
#        (no frac_logits) and rejects return_fractions/temporal_coords.
#
#   Coverage: 6011/7882 tiles TerraMind-complete (spectral+s1_vv_vh).
#   Weights: TerraMind cached under /cephfs/model_cache/hf (loaded via
#   terratorch BACKBONE_REGISTRY). Needs the terratorch pip pkg.
#
#   CROP / IMG SIZE = 496 (NOT 504): TerraMind is patch_size=16.
#   504/16 = 31.5 → model build raises ("must be divisible by patch_size=16",
#   verified locally). 496/16 = 31 (OK). Tiles are 512 px so 496 fits.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-terramind
  namespace: prithvi-training-default
  labels: { app: unified-training, dataset: "512", purpose: terramind }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: unified-training, purpose: terramind }
    spec:
      activeDeadlineSeconds: 43200
      restartPolicy: Never
      nodeSelector: { accelerator: nvidia-h100 }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - { key: kubernetes.io/hostname, operator: NotIn, values: ["p02r08srv02"] }
      containers:
      - name: trainer
        image: python:3.11-slim
        env:
        - { name: PYTHONUNBUFFERED, value: "1" }
        - { name: HF_HOME, value: "/cephfs/model_cache/hf" }
        command: ["/bin/bash","-c"]
        args:
        - |
          set -e
          export PYTHONUNBUFFERED=1
          echo "=== TerraMind v1-base member — distill labels + frac head (28-class) — $(date) ==="

          apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
          pip install --quiet --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu121
          pip install --quiet --no-cache-dir timm numpy scipy scikit-learn huggingface_hub terratorch

          mkdir -p /workspace && cd /workspace
          BRANCH=agent/te/opus/nfi-nmd2023-benchmark
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/TobiasEdman/ImintEngine.git imintengine
          cd /workspace/imintengine
          pip install --no-cache-dir -e . || pip install --quiet --no-cache-dir -r requirements.txt
          echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"

          # --- PREFLIGHT: fail loud unless the training-path glue is real ---
          python - <<'PY'
          import inspect, sys
          from imint.training import unified_dataset as ud
          from imint.fm import forward_router as fr
          from imint.fm.terramind_seg import TerraMindSegmentationModel as T
          fails = []
          if "terramind_v1_base" not in ud.UnifiedDataset._SUPPORTED_MODEL_KEYS:
              fails.append("dataset cannot build terramind tensors")
          if "model_keys" not in inspect.getsource(__import__('scripts.train_unified', fromlist=['x'])):
              fails.append("train_unified.py never sets model_keys")
          if "s1_vv_vh" not in inspect.getsource(ud):
              fails.append("dataset never emits s1_vv_vh (SAR)")
          if "return_fractions" not in inspect.signature(T.forward).parameters:
              fails.append("TerraMindSeg.forward lacks return_fractions/frac head")
          # Per-family routing lives in forward_router.family_forward. Assert the
          # TerraMind branch builds the {S2L2A, S1GRD} modality dict.
          src_fr = inspect.getsource(fr)
          if 'family == "terramind"' not in src_fr or "S2L2A" not in src_fr:
              fails.append("forward_router never builds the TerraMind modality dict")
          if fails:
              print("PREFLIGHT FAILED — TerraMind path not wired:")
              for f in fails: print("  -", f)
              sys.exit(3)
          print("preflight OK")
          PY

          mkdir -p /cephfs/checkpoints/terramind
          cd /cephfs
          # patch-16 → img/patch 496 (NOT 504). Single-frame.
          python /workspace/imintengine/scripts/train_unified.py \
            --backbone-name terramind_v1_base \
            --data-dirs /cephfs/unified_v2_512 \
            --label-dir /cephfs/nmd2023_distill_labels \
            --frac-dir /cephfs/tradslag_fracs \
            --enable-tradslag-head \
            --lambda-frac 1.0 \
            --checkpoint-dir /cephfs/checkpoints/terramind \
            --num-classes 28 \
            --epochs 30 \
            --batch-size 8 \
            --lr 1e-4 \
            --weight-decay 0.35 \
            --loss-type focal_dice \
            --focal-gamma 2.0 \
            --patch-size 496 \
            --img-size 496 \
            --weighting-method sqrt \
            --label-smoothing 0.05 \
            --lovasz-weight 0.3 \
            --patience 20 \
            --num-workers 16 \
            --device cuda
          echo "=== Done: $(date) ==="
        volumeMounts:
        - { mountPath: /cephfs, name: cephfs }
        - { mountPath: /data, name: cephfs }
        - { mountPath: /dev/shm, name: dshm }
        resources:
          requests: { cpu: "16", memory: "80Gi", nvidia.com/gpu: "1" }
          limits:   { cpu: "16", memory: "80Gi", nvidia.com/gpu: "1" }
      volumes:
      - name: cephfs
        persistentVolumeClaim: { claimName: training-data-cephfs }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
