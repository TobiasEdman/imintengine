---
# Stage Skogsstyrelsen's Trädhöjd (tree height) for the open-data mirror,
# one county at a time, deleting each raw zip after its derived raster is
# verified (backlog IM-022; Tobias 2026-10-19: "Hämta ett län i taget och
# radera efteråt").
#
# Why: the 230 NFI top-up tiles need the height aux channel. The tiles touch
# all 21 counties (read-only probe 2026-10-19), the 21 sksTradhojd<län>.zip
# files are 329.2 GiB raw and the PVC had 234 GiB free, so the raw zips
# cannot all be kept. Height is the 10 m p90 of the 1 m product: a
# documented version difference from the retired proxy channel (MAE about
# 1 m, docs/data/skg_open_mirror.md), like markfukt.
#
# Per county, scripts/stage_skg_open.py downloads the zip and records its
# sha256, bytes, URL and download date in MANIFEST.json. It extracts the
# zip's 1 m raster to a work file about the zip's size (Deflate64 always,
# streamed by Info-ZIP unzip; Deflate too, because the 8 workers read rows
# in parallel), derives
# tradhojd/tradhojd_10m_<län>.tif with --tradhojd-workers 8 (the strips are
# reduced in 8 processes and written in order; the raster equals the serial
# one) and verifies it: EPSG:3006, int16,
# nodata -1, 10 m, the source's extent, readable, valid cells, 0..1000 dm.
# Only then does it save the record, delete the raw zip, record
# raw_deleted_at and rebuild tradhojd_10m.vrt from the staged counties. Two
# counties' raw zips are never on disk together; peak use is about the
# largest zip twice (county 25: 55.3 GiB, plus its extraction).
#
# 2026-10-20: the first run (serial, 1ef10d1) took ~19 min per GiB of zip
# (counties 01, 03-06: ~104 h for all 21). Measured on county 07 with 8
# workers: 68 s extraction + 852 s derivation, 8 cores, peak 10.9 GiB.
# The parallel run (3ee27ab) staged counties 07-21 (~4 min per GiB with
# download) and was stopped at 17:12Z while county 22 downloaded: inflate64
# had kept 27 GB in the parent after county 21, and counties 22-25 would
# have been OOM-killed. Deflate64 is now streamed by unzip (a few MB).
# Each extracted work file is read back and its CRC-32 checked against the
# zip directory (~2 s per 4 GiB measured), and a partial one is removed on
# failure or SIGTERM (fcd4445). The run resumed 2026-10-21 05:49Z (pin
# 4e7734f) staged 22 and 23 (Deflate64 through unzip, 13856 s with the
# download) and stopped at 12:03Z on county 24: its zip is 689 Deflate
# tiles + a mosaic VRT (102.7 GiB extracted), with no CRS or nodata tag
# and 0 at sea. 3351bb6 extracts and checks them, gives the VRT nodata
# -1, and makes an all-0 10 m cell nodata. The 8 workers' strips take
# ~2.8 GiB each at county 24's 360 km width (measured), far below the
# limit with GDAL_CACHEMAX 512 (set since ec6d39f).
# Run r2 (3351bb6, applied 14:24Z) staged 24 in 6505 s, but its tile
# 720_76 is truncated in the published zip: GDAL 3.10's threaded VRT read
# dropped the read errors, so ~39 km² became nodata without failing.
# a7fb028 reads the VRT serially, so an unreadable block fails the run,
# and stages the listed truncated tile with its gaps recorded
# (KNOWN_TRUNCATED_TILES; read_tradhojd refuses windows touching them).
# The next apply backfills county 24's gaps; its raster is unchanged.
# Run r3 (a7fb028, 2026-10-21 20:02Z) recorded those gaps. A dry run of the
# NFI top-up aux pass then found county 23 published with 0 (not -1)
# outside the county, covering counties 20-22 in the mosaic; county 24's
# tiles also carry heights outside 24. d0307e8 masks every county raster to
# its county (grunddata ∪ markfukt valid; outside = -1): applied once after
# a fresh derivation and, for counties already staged, on the next apply,
# which prints "masked ... cells cleared" per county and rewrites no zip.
# b92790b (Codex review of #96): masking needs both mask sources, and a mask
# interrupted between the raster and manifest writes is finished on restart
# ("finished an interrupted rewrite ...") before the raw-deletion check.
# The NaN-height change (2026-10-22, heights' nodata now reads NaN): the all-zero rule is
# retired, and county 24, derived under it, gets its treeless 0 back inside
# the county, except at the recorded gap ("restored the treeless 0 ...").
# No cell of its mask lies outside its 689 tiles (probe).
# Switch-over: delete the running Job right after a county's "done in"
# line (its pod gets SIGTERM, forward_term passes it on, the lock is
# released), check no skg-open-stage Job is ACTIVE and no MANIFEST.lock is
# left, then apply this; finished counties are skipped.
# --min-free-gib 50 stops cleanly (exit 3) before a download or inflation
# that would leave less than 50 GiB free. Re-apply under a new name to
# resume: finished counties are skipped.
#
# Grunddata and markfukt are not touched by this Job. The reader
# (imint/training/skg_open.read_tradhojd) refuses any window whose county is
# not yet staged. Writes ONLY under /data/skg_open. No tile is touched.
#
# The script holds /data/skg_open/MANIFEST.lock from its first manifest read
# to its last save and refuses to start while another writer holds it (the
# raw-drop Job takes the same lock). Apply only when no skg-open-stage Job
# shows ACTIVE > 0 in `kubectl get jobs -l purpose=skg-open-stage`; a lock
# left by a killed pod is removed by hand after that check. bash forwards
# SIGTERM to the script (forward_term), so the 6-day deadline, an eviction
# or a delete releases the lock within terminationGracePeriodSeconds.
#
# Code pin: IMINT_COMMIT (full sha) and IMINT_SCRIPT_SHA256 (`git show
# <sha>:scripts/stage_skg_open.py | sha256sum`); the pod refuses to run if
# either check fails.
apiVersion: batch/v1
kind: Job
metadata:
  name: skg-open-stage-tradhojd
  namespace: prithvi-training-default
  labels: {app: fieldtruth-prep, purpose: skg-open-stage}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 518400        # 6 d cap; 329 GiB download + inflate + derive, resumable
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: fieldtruth-prep}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300   # time for the script to unwind and release MANIFEST.lock
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # p02r09srv04 + srv06 fail pod-sandbox creation (runc bug)
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["p02r09srv04", "p02r09srv06"]
      containers:
        - name: stage
          image: python:3.11-slim@sha256:5be45dbade29bebd6886af6b438fd7e0b4eb7b611f39ba62b430263f82de36d2
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              export PYTHONUNBUFFERED=1
              T0=$(date -u +%s)
              echo "=== skg-open-stage-tradhojd — $(date -u) ==="
              apt-get update -qq && apt-get install -y -qq git gdal-bin unzip >/dev/null 2>&1
              unzip -v | grep DEFLATE64 >/dev/null    # Deflate64 zips are streamed by unzip; no -q, which could SIGPIPE unzip under pipefail
              pip install -q --no-cache-dir numpy rasterio
              gdalinfo --version
              mkdir -p /workspace && cd /workspace
              git init -q ie && cd ie
              git fetch -q --depth 1 https://github.com/TobiasEdman/ImintEngine.git "${IMINT_COMMIT}"
              git checkout -q FETCH_HEAD
              export IMINT_GIT_SHA="$(git rev-parse HEAD)"
              test "${IMINT_GIT_SHA}" = "${IMINT_COMMIT}"
              echo "${IMINT_SCRIPT_SHA256}  scripts/stage_skg_open.py" | sha256sum -c -
              echo "HEAD: ${IMINT_GIT_SHA}"
              # Kubernetes sends SIGTERM only to PID 1, this bash, which neither
              # dies from it nor passes it on; the pod would be SIGKILLed after
              # the grace period with MANIFEST.lock left behind. forward_term
              # runs the script in the background, forwards TERM to it, waits
              # for its real exit code (RC) and exits with it if TERM came.
              forward_term() {
                "$@" &
                CHILD=$!
                trap 'kill -TERM "${CHILD}" 2>/dev/null || true; TERMINATED=1' TERM
                RC=0
                wait "${CHILD}" || RC=$?
                while kill -0 "${CHILD}" 2>/dev/null; do RC=0; wait "${CHILD}" || RC=$?; done
                trap - TERM
                if [ "${TERMINATED:-0}" = 1 ]; then exit "${RC}"; fi
              }
              df -h /data | tail -1
              forward_term python scripts/stage_skg_open.py --dest /data/skg_open \
                --products tradhojd --counties ${COUNTIES} \
                --drop-raw --min-free-gib "${MIN_FREE_GIB}" --tradhojd-workers "${TRADHOJD_WORKERS}"
              echo "=== manifest summary (stage exit ${RC}) ==="
              python - <<'PY'
              import json
              m = json.load(open("/data/skg_open/MANIFEST.json"))
              th = {k: v for k, v in m["derived"].items() if k.startswith("tradhojd/tradhojd_10m_")}
              dropped = sorted(n for n, r in m["files"].items() if n.startswith("sksTradhojd") and r.get("raw_deleted_at"))
              kept = sorted(n for n, r in m["files"].items() if n.startswith("sksTradhojd") and not r.get("raw_deleted_at"))
              print(f"tradhojd counties derived {len(th)}: {sorted(k[-6:-4] for k in th)}")
              print(f"tradhojd derived {sum(r['bytes'] for r in th.values()) / 2**30:.2f} GiB; raw deleted {len(dropped)}, raw still on disk {kept}")
              print(f"tradhojd vrt sources: {len(m['vrt'].get('tradhojd/tradhojd_10m.vrt', {}).get('sources', []))}")
              PY
              du -sh /data/skg_open/tradhojd /data/skg_open/raw 2>/dev/null || true
              df -h /data | tail -1
              echo "runtime: $(( ($(date -u +%s) - T0) / 60 )) min"
              echo "=== done: $(date -u) ==="
              exit ${RC}
          env:
            - {name: IMINT_COMMIT, value: "4e8a80ca52b680041b89814cf5817b076d7d57a9"}
            - {name: IMINT_SCRIPT_SHA256, value: "1bf3fdbd4e5ecd4d680eb31a1c493111eaa7499c1a4c49027a7caf46c01e1dd7"}
            - {name: TRADHOJD_WORKERS, value: "8"}
            - {name: COUNTIES, value: "01 03 04 05 06 07 08 09 10 12 13 14 17 18 19 20 21 22 23 24 25"}
            - {name: MIN_FREE_GIB, value: "50"}
            - {name: GDAL_CACHEMAX, value: "512"}
          resources:
            requests: {cpu: "9", memory: "48Gi"}      # 8 workers + the writer; 10.9 GiB peak on county 07,
            limits: {cpu: "9", memory: "48Gi"}        # a worker's strip grows with the county's width
          volumeMounts:
            - {name: d, mountPath: /data}
      volumes:
        - name: d
          persistentVolumeClaim: {claimName: training-data-cephfs}
