apiVersion: batch/v1
kind: Job
metadata:
  name: ladder-r4-tessera
  namespace: prithvi-training-default
  labels: { app: unified-training, purpose: ladder, rung: "r4", model: tessera }
spec:
  backoffLimit: 1
  # No Job-level activeDeadlineSeconds: it counts from job creation and
  # includes queue time, so a long GPU wait can burn the entire budget
  # before the pod runs (killed train-tessera-gated 2026-08-10: 12h
  # queued, 0 epochs). The run cap lives on the pod below, whose clock
  # starts at pod startTime (post-schedule) — queue time is free.
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: unified-training, purpose: ladder, rung: "r4", model: tessera }
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 43200   # 12h RUN cap (from pod start, not queue)
      nodeSelector:
        accelerator: nvidia-h100
      # srv02's GPU admission is desynced (UnexpectedAdmissionError 2026-08-09,
      # 2 pods failed) — exclude it; the job queues until srv01/srv03 frees.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [p02r08srv02]
      containers:
        - name: trainer
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== Tessera ensemble member — distill labels + frac head (28-class) — $(date) ==="
              echo "Encoder-diversity member: precomputed Tessera embeddings, single-frame, cold start."
              T=$(ls /cephfs/unified_v2_512/*.npz 2>/dev/null | wc -l)
              D=$(ls /cephfs/nmd2023_distill_labels/*.npz 2>/dev/null | wc -l)
              F=$(ls /cephfs/tradslag_fracs/*.npz 2>/dev/null | wc -l)
              echo "Tiles: $T | distill sidecars: $D | frac sidecars: $F"
              [ "$T" -lt 100 ] && { echo "ERROR: too few tiles"; exit 1; }
              [ "$D" -lt 100 ] && { echo "FATAL: distill labels missing"; exit 1; }
              [ "$F" -lt 100 ] && { echo "FATAL: frac sidecars missing"; exit 1; }
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              pip install --quiet --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu121
              pip install --quiet --no-cache-dir timm numpy scipy scikit-learn huggingface_hub
              mkdir -p /cephfs/checkpoints/ladder/tessera_r4
              rm -f /cephfs/checkpoints/ladder/tessera_r4/*.pt.tmp 2>/dev/null || true
              mkdir -p /workspace && cd /workspace
              BRANCH=main
              git clone --depth 1 --branch "$BRANCH" \
                https://github.com/TobiasEdman/ImintEngine.git imintengine
              cd /workspace/imintengine
              pip install --no-cache-dir -e . || pip install --quiet --no-cache-dir -r requirements.txt
              echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"
              grep -q 'enable-tradslag-head' scripts/train_unified.py \
                || { echo "FATAL: tradslag flags missing on clone"; exit 1; }
              # D1 wiring must be on the clone — tessera routing in the dataset.
              grep -q 'tessera' imint/training/unified_dataset.py \
                || { echo "FATAL: tessera dataset wiring missing on clone"; exit 1; }
              # Tessera embeddings are baked into the tile npz — verify on a sample.
              python - <<'PY'
              import glob, sys
              import numpy as np
              paths = sorted(glob.glob("/cephfs/unified_v2_512/*.npz"))[:3]
              missing = [p for p in paths if "tessera" not in np.load(p).files]
              if missing:
                  sys.exit(f"FATAL: tiles without tessera key: {missing}")
              print(f"tessera key present in {len(paths)} sampled tiles")
              PY
              cd /cephfs
              # Same target as the distill member (distill labels + frac head)
              # but tessera_v1 backbone: single-frame (NO --enable-multitemporal),
              # No --unfreeze-layers/--backbone-lr-factor: there is no encoder
              # to freeze; the whole seg head trains at full LR.
              # NOTE: batch-size/epochs provisional until the local 1-epoch
              # smoke has confirmed memory + convergence behaviour.
              python /workspace/imintengine/scripts/train_unified.py \
                --backbone-name tessera_v1 \
                --data-dirs /cephfs/unified_v2_512 \
                --enable-markfukt \
                --label-dir /cephfs/distill/tessera_r2 \
                --frac-dir /cephfs/tradslag_fracs \
                --enable-tradslag-head \
                --aux-fusion gated \
                --lambda-frac 1.0 \
                --checkpoint-dir /cephfs/checkpoints/ladder/tessera_r4 \
                --num-classes 28 \
                --epochs 30 \
                --batch-size 8 \
                --lr 1e-4 \
                --weight-decay 0.35 \
                --loss-type focal_dice \
                --focal-gamma 2.0 \
                --patch-size 504 \
                --img-size 504 \
                --weighting-method sqrt \
                --label-smoothing 0.05 \
                --lovasz-weight 0.3 \
                --patience 20 \
                --num-workers 16 \
                --device cuda
              echo "=== Done: $(date) ==="
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cephfs
              mountPath: /cephfs
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cephfs
          persistentVolumeClaim:
            claimName: training-data-cephfs
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
