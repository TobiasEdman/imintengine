apiVersion: batch/v1
kind: Job
metadata:
  name: ladder-r2-terramind
  namespace: prithvi-training-default
  labels: { app: unified-training, purpose: ladder, rung: "r2", model: terramind }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: unified-training, purpose: ladder, rung: "r2", model: terramind }
    spec:
      activeDeadlineSeconds: 43200
      restartPolicy: Never
      nodeSelector: { accelerator: nvidia-h100 }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - { key: kubernetes.io/hostname, operator: NotIn, values: ["p02r08srv02"] }
      containers:
      - name: trainer
        image: python:3.11-slim
        env:
        - { name: PYTHONUNBUFFERED, value: "1" }
        - { name: HF_HOME, value: "/cephfs/model_cache/hf" }
        command: ["/bin/bash","-c"]
        args:
        - |
          set -e
          export PYTHONUNBUFFERED=1
          echo "=== TerraMind v1-base member — distill labels + frac head (28-class) — $(date) ==="
          apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
          pip install --quiet --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu121
          pip install --quiet --no-cache-dir timm numpy scipy scikit-learn huggingface_hub terratorch
          mkdir -p /workspace && cd /workspace
          BRANCH=main
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/TobiasEdman/ImintEngine.git imintengine
          cd /workspace/imintengine
          pip install --no-cache-dir -e . || pip install --quiet --no-cache-dir -r requirements.txt
          echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"
          # --- PREFLIGHT: fail loud unless the training-path glue is real ---
          python - <<'PY'
          import inspect, sys
          from imint.training import unified_dataset as ud
          from imint.fm import forward_router as fr
          from imint.fm.terramind_seg import TerraMindSegmentationModel as T
          fails = []
          if "terramind_v1_base" not in ud.UnifiedDataset._SUPPORTED_MODEL_KEYS:
              fails.append("dataset cannot build terramind tensors")
          if "model_keys" not in inspect.getsource(__import__('scripts.train_unified', fromlist=['x'])):
              fails.append("train_unified.py never sets model_keys")
          if "s1_vv_vh" not in inspect.getsource(ud):
              fails.append("dataset never emits s1_vv_vh (SAR)")
          if "return_fractions" not in inspect.signature(T.forward).parameters:
              fails.append("TerraMindSeg.forward lacks return_fractions/frac head")
          # Per-family routing lives in forward_router.family_forward. Assert the
          # TerraMind branch builds the {S2L2A, S1GRD} modality dict.
          src_fr = inspect.getsource(fr)
          if 'family == "terramind"' not in src_fr or "S2L2A" not in src_fr:
              fails.append("forward_router never builds the TerraMind modality dict")
          # ΔSAR clone-guard: the delta-channel compute + opt-in must be in the
          # cloned code, else --enable-delta-sar would silently be a no-op.
          if not hasattr(ud, "compute_delta_sar"):
              fails.append("dataset missing compute_delta_sar (ΔSAR not in clone)")
          if "delta_vv" not in inspect.getsource(ud):
              fails.append("dataset never wires delta_vv/delta_vh aux channels")
          from imint.training.config import TrainingConfig as _Cfg
          if "delta_vv" not in _Cfg(enable_delta_sar_channels=True).enabled_aux_names:
              fails.append("config never appends delta_vv/delta_vh when opted in")
          if fails:
              print("PREFLIGHT FAILED — TerraMind path not wired:")
              for f in fails: print("  -", f)
              sys.exit(3)
          print("preflight OK")
          PY
          # --- PREFLIGHT: fail loud on a PARTIAL S1 v3 enrichment ---
          # Never train the ΔSAR retrain on a half-enriched dataset: the delta
          # channels would be zero on every not-yet-v3 tile, poisoning the
          # anchor. Require >=95% of tiles to carry s1_enrich_v==4.
          python - <<'PY'
          import glob, sys
          import numpy as np
          roots = ["/cephfs/unified_v2_512/tiles", "/cephfs/unified_v2_512"]
          tiles = []
          for r in roots:
              tiles = sorted(glob.glob(r + "/*.npz"))
              if tiles:
                  break
          if not tiles:
              print("PREFLIGHT FAILED — no tiles under /cephfs/unified_v2_512"); sys.exit(4)
          n = len(tiles); v3 = 0; with2016 = 0
          for p in tiles:
              try:
                  with np.load(p, allow_pickle=True) as z:
                      if "s1_enrich_v" in z.files and int(z["s1_enrich_v"].item()) == 4:
                          v3 += 1
                      if "s1_vv_vh_2016" in z.files:
                          with2016 += 1
              except Exception:
                  pass
          frac = v3 / n
          print(f"S1 enrichment: {v3}/{n} tiles s1_enrich_v==4 ({frac:.1%}); "
                f"{with2016}/{n} carry s1_vv_vh_2016 ({with2016/n:.1%})")
          if frac < 0.95:
              print(f"PREFLIGHT FAILED — only {frac:.1%} of tiles are s1_enrich_v==4 "
                    f"(<95%). Wait for enrich-s1-season to finish before training.")
              sys.exit(5)
          print("enrichment coverage OK")
          PY
          mkdir -p /cephfs/checkpoints/ladder/terramind_r2
          cd /cephfs
          # patch-16 → img/patch 496 (NOT 504). Single-frame.
          python /workspace/imintengine/scripts/train_unified.py \
            --backbone-name terramind_v1_base \
            --data-dirs /cephfs/unified_v2_512 \
            --enable-markfukt \
            --label-dir /cephfs/nmd2023_labels \
            --enable-tradslag-head \
            --enable-delta-sar \
            --lambda-frac 1.0 \
            --checkpoint-dir /cephfs/checkpoints/ladder/terramind_r2 \
            --num-classes 28 \
            --epochs 30 \
            --batch-size 8 \
            --lr 1e-4 \
            --weight-decay 0.35 \
            --loss-type focal_dice \
            --focal-gamma 2.0 \
            --patch-size 496 \
            --img-size 496 \
            --weighting-method sqrt \
            --label-smoothing 0.05 \
            --lovasz-weight 0.3 \
            --patience 20 \
            --num-workers 16 \
            --device cuda
          echo "=== Done: $(date) ==="
        volumeMounts:
        - { mountPath: /cephfs, name: cephfs }
        - { mountPath: /data, name: cephfs }
        - { mountPath: /dev/shm, name: dshm }
        resources:
          requests: { cpu: "16", memory: "48Gi", nvidia.com/gpu: "1" }
          limits:   { cpu: "16", memory: "48Gi", nvidia.com/gpu: "1" }
      volumes:
      - name: cephfs
        persistentVolumeClaim: { claimName: training-data-cephfs }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
