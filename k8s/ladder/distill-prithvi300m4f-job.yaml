# GENERATED by scripts/gen_ladder_manifests.py — do not edit.
# Distill stage for prithvi300m4f: r2 checkpoint → plot features →
# pinned-protocol distillability OOF → deployable head → dense
# sidecars in /cephfs/distill/prithvi300m4f_r2 (consumed by rungs 3/4).
# Prereq: ladder-distill-pinned-plots (once, shared).
# Plan: docs/experiments/ladder_distill_stage.md
apiVersion: batch/v1
kind: Job
metadata:
  name: ladder-distill-prithvi300m4f
  namespace: prithvi-training-default
  labels: { app: unified-training, purpose: ladder-distill, model: prithvi300m4f }
spec:
  backoffLimit: 0
  # Budget: dense pass = 7882 tiles (optical) x 1-5 s/tile on a 2080ti
  # (forward + cephfs np.load + 256-ch upsample + per-pixel matmul)
  # = 2.2-11 h, plus extract (~0.5 h) and CPU steps. 24 h leaves ~2x
  # headroom over the pessimistic end; the deadline only caps runaway.
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: unified-training, purpose: ladder-distill, model: prithvi300m4f }
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia-gtx-2080ti
      containers:
        - name: distill
          image: python:3.11-slim@sha256:d1e9ca7c4e78d1e8ecadb5d44bfc8e956e7a65b659a9950f569f243d72b326d0
          command:
            - bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== ladder distill stage — prithvi300m4f ==="
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              pip install --quiet --no-cache-dir --no-deps torch==2.10.0+cu126 torchvision==0.25.0+cu126 \
                --index-url https://download.pytorch.org/whl/cu126
              pip install --quiet --no-cache-dir --no-deps \
                affine==3.0.1 attrs==26.1.0 certifi==2026.7.22 \
                charset-normalizer==3.5.1 click==8.5.0 \
                click-plugins==1.1.1.2 cligj==0.7.2 cloudpickle==3.1.2 \
                cuda-bindings==12.9.4 cuda-pathfinder==1.8.1 einops==0.8.0 \
                filelock==3.32.5 fsspec==2026.7.0 huggingface-hub==0.26.2 \
                idna==3.19 jinja2==3.1.6 joblib==1.6.0 markupsafe==3.0.3 \
                mpmath==1.3.0 networkx==3.6.1 numpy==1.26.4 \
                nvidia-cublas-cu12==12.6.4.1 nvidia-cuda-cupti-cu12==12.6.80 \
                nvidia-cuda-nvrtc-cu12==12.6.77 \
                nvidia-cuda-runtime-cu12==12.6.77 \
                nvidia-cudnn-cu12==9.10.2.21 nvidia-cufft-cu12==11.3.0.4 \
                nvidia-cufile-cu12==1.11.1.6 nvidia-curand-cu12==10.3.7.77 \
                nvidia-cusolver-cu12==11.7.1.2 \
                nvidia-cusparse-cu12==12.5.4.2 nvidia-cusparselt-cu12==0.7.1 \
                nvidia-nccl-cu12==2.27.5 nvidia-nvjitlink-cu12==12.6.85 \
                nvidia-nvshmem-cu12==3.4.5 nvidia-nvtx-cu12==12.6.77 \
                packaging==26.3 pandas==2.2.2 pillow==10.4.0 pyarrow==17.0.0 \
                pyparsing==3.3.2 pyproj==3.6.1 python-dateutil==2.9.0.post0 \
                pytz==2026.3.post1 pyyaml==6.0.2 rasterio==1.3.11 \
                requests==2.34.2 safetensors==0.8.0 scikit-learn==1.5.1 \
                scipy==1.13.1 setuptools==84.0.0 six==1.17.0 snuggs==1.4.7 \
                sympy==1.14.0 threadpoolctl==3.6.0 timm==1.0.11 tqdm==4.70.0 \
                triton==3.6.0 typing-extensions==4.16.0 tzdata==2026.3 \
                urllib3==2.7.0

              mkdir -p /workspace && cd /workspace
              HEAD_SHA=9750fa917ec95962d59c3468ffaa521bb9e7e01c
              git init -q imintengine && cd imintengine
              git remote add origin https://github.com/TobiasEdman/ImintEngine.git
              git fetch -q --depth 1 origin "$HEAD_SHA"
              git checkout -q "$HEAD_SHA"
              echo "PINNED SOURCE: $HEAD_SHA"
              mkdir -p /cephfs/ops/deps
              pip freeze > /cephfs/ops/deps/ladder-distill-prithvi300m4f-$(date -u +%Y%m%dT%H%M%SZ).txt
              # Per-column backbone deps — the r2 checkpoints cannot even
              # LOAD without them (terramind: terratorch ImportError killed
              # the first submission; croma/clay: their loader packages).
              true  # no extra deps

              CKPT=/cephfs/checkpoints/ladder/prithvi300m4f_r2/best_model.pt
              PIN=/cephfs/distill/pinned_plots.json
              OUT=/cephfs/distill/prithvi300m4f_r2
              test -f "$CKPT" || { echo "FATAL: no rung-2 checkpoint at $CKPT"; exit 1; }
              test -f "$PIN"  || { echo "FATAL: no pinned plot set at $PIN — run k8s/ladder/distill-pinned-plots-job.yaml first"; exit 1; }
              mkdir -p "$OUT" /cephfs/distill/heads

              echo "=== 1/4 extract plot features (rung-2 checkpoint, 11 aux) ==="
              python3 scripts/extract_plot_features.py \
                --checkpoint "$CKPT" \
                --plot-index /cephfs/nfi/nfi_index_unified_v2_512.parquet \
                --img-size 496 \
                --backbone-name prithvi_300m \
                --enable-markfukt \
                --out /cephfs/distill/heads/prithvi300m4f_r2_plot_features.parquet \
                --device cuda

              echo "=== 2/4 distillability — pinned-protocol OOF (the cross-backbone number) ==="
              python3 scripts/nfi_head_cv.py \
                --features /cephfs/distill/heads/prithvi300m4f_r2_plot_features.parquet \
                --folds 5 \
                --heads mlp \
                --pinned-plots "$PIN" \
                --out /cephfs/distill/heads/prithvi300m4f_r2_distillability.json

              echo "=== 3/4 deployable head (grouped-by-tile split, full plot set) ==="
              python3 scripts/train_distill_head.py \
                --features /cephfs/distill/heads/prithvi300m4f_r2_plot_features.parquet \
                --test-frac 0.2 --seed 42 \
                --out-head /cephfs/distill/heads/prithvi300m4f_r2_head.npz \
                --out-split /cephfs/distill/heads/prithvi300m4f_r2_split.json

              echo "=== 4/4 dense sidecars + cohort gate ==="
              python3 scripts/distill_forest_labels.py \
                --checkpoint "$CKPT" \
                --head /cephfs/distill/heads/prithvi300m4f_r2_head.npz \
                --data-dir /cephfs/unified_v2_512 \
                --label-dir /cephfs/nmd2023_labels \
                --out-dir "$OUT" \
                --img-size 496 \
                --backbone-name prithvi_300m \
                --enable-markfukt \
                --device cuda

              echo ""
              # The queue's signal: state on DISK, never job existence (the
              # reaper deletes finished Jobs — the exact interaction that
              # bit rung-1 resubmission). set -e means reaching this line
              # proves all four steps INCLUDING the cohort gate passed.
              touch "$OUT/_GATE_OK"
              echo "=== distill stage complete for prithvi300m4f — rungs 3/4 unlocked ==="
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token, optional: true }
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - { name: cephfs, mountPath: /cephfs }
            # Same PVC, second mount point. The NFI plot index stores
            # ABSOLUTE tile paths under /data/ (written by the nfi-* jobs,
            # which mount there); with only /cephfs mounted the extract
            # step drops all 982 plots as "no longer in the dataset" and
            # dies — the first distill submission failed exactly so
            # (reaper archive 20260831T0920Z).
            - { name: cephfs, mountPath: /data }
      volumes:
        - name: cephfs
          persistentVolumeClaim: { claimName: training-data-cephfs }
