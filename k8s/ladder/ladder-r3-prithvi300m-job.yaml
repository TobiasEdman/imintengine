# Prithvi-EO-2.0 300M ensemble member — distill labels + Trädslag frac head.
#
# Coarse patch-16 anchor for the model race (same field-calibrated target as
# train-tessera-gated). Single-frame, cold-start from the pretrained Prithvi
# backbone. Weights are pulled by the loader from HF (cached in
# /data/model_cache/hf if present).
#
# CROP / IMG SIZE = 496 (NOT 504):
#   Prithvi-300M is patch_size=16. 504/16 = 31.5 → non-integer token grid →
#   model build raises. 496/16 = 31 (OK). Tiles are 512 px so 496 fits.
#   Do NOT copy the 504 from the tessera template (tessera is patch_size=1).
#
# Differs from tessera template: this backbone HAS a ViT encoder, so we
# freeze it and unfreeze the last blocks (linear-probe + partial fine-tune),
# and drop --aux-fusion gated (tessera-specific).
apiVersion: batch/v1
kind: Job
metadata:
  name: ladder-r3-prithvi300m
  namespace: prithvi-training-default
  labels: { app: unified-training, purpose: ladder, rung: "r3", model: prithvi300m }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: unified-training, purpose: ladder, rung: "r3", model: prithvi300m }
    spec:
      activeDeadlineSeconds: 43200
      restartPolicy: Never
      nodeSelector: { accelerator: nvidia-h100 }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - { key: kubernetes.io/hostname, operator: NotIn, values: ["p02r08srv02"] }
      containers:
      - name: trainer
        image: python:3.11-slim
        env:
        - { name: PYTHONUNBUFFERED, value: "1" }
        - { name: HF_HOME, value: "/cephfs/model_cache/hf" }
        command: ["/bin/bash","-c"]
        args:
        - |
          set -e
          export PYTHONUNBUFFERED=1
          echo "=== Prithvi-300M member — distill labels + frac head (28-class) — $(date) ==="
          T=$(ls /cephfs/unified_v2_512/*.npz 2>/dev/null | wc -l)
          D=$(ls /cephfs/nmd2023_distill_labels/*.npz 2>/dev/null | wc -l)
          F=$(ls /cephfs/tradslag_fracs/*.npz 2>/dev/null | wc -l)
          echo "Tiles: $T | distill sidecars: $D | frac sidecars: $F"
          [ "$T" -lt 100 ] && { echo "ERROR: too few tiles"; exit 1; } || true
          [ "$D" -lt 100 ] && { echo "FATAL: distill labels missing"; exit 1; } || true
          [ "$F" -lt 100 ] && { echo "FATAL: frac sidecars missing"; exit 1; } || true
          apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
          pip install --quiet --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu121
          pip install --quiet --no-cache-dir timm numpy scipy scikit-learn huggingface_hub
          mkdir -p /cephfs/checkpoints/ladder/prithvi300m_r3
          rm -f /cephfs/checkpoints/ladder/prithvi300m_r3/*.pt.tmp 2>/dev/null || true
          mkdir -p /workspace && cd /workspace
          BRANCH=agent/te/opus/nfi-nmd2023-benchmark
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/TobiasEdman/ImintEngine.git imintengine
          cd /workspace/imintengine
          pip install --no-cache-dir -e . || pip install --quiet --no-cache-dir -r requirements.txt
          echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"
          grep -q 'enable-tradslag-head' scripts/train_unified.py \
            || { echo "FATAL: tradslag flags missing on clone"; exit 1; }
          cd /cephfs
          # Prithvi-300M: patch-16 → img/patch 496 (NOT 504). Encoder present:
          # freeze + unfreeze last 6 blocks. Single-frame (no multitemporal).
          python /workspace/imintengine/scripts/train_unified.py \
            --backbone-name prithvi_300m \
            --data-dirs /cephfs/unified_v2_512 \
            --label-dir /cephfs/distill/prithvi300m_r2 \
            --enable-tradslag-head \
            --lambda-frac 1.0 \
            --checkpoint-dir /cephfs/checkpoints/ladder/prithvi300m_r3 \
            --num-classes 28 \
            --epochs 30 \
            --batch-size 8 \
            --lr 1e-4 \
            --weight-decay 0.35 \
            --loss-type focal_dice \
            --focal-gamma 2.0 \
            --patch-size 496 \
            --img-size 496 \
            --weighting-method sqrt \
            --label-smoothing 0.05 \
            --lovasz-weight 0.3 \
            --unfreeze-layers 6 \
            --backbone-lr-factor 0.1 \
            --patience 20 \
            --num-workers 16 \
            --device cuda
          echo "=== Done: $(date) ==="
        volumeMounts:
        - { mountPath: /cephfs, name: cephfs }
        - { mountPath: /dev/shm, name: dshm }
        resources:
          requests: { cpu: "16", memory: "80Gi", nvidia.com/gpu: "1" }
          limits:   { cpu: "16", memory: "80Gi", nvidia.com/gpu: "1" }
      volumes:
      - name: cephfs
        persistentVolumeClaim: { claimName: training-data-cephfs }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
