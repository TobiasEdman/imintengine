# IM-023 Prithvi-600M step 2a: one-epoch smoke of both variants, in sequence.
# Recipe: scripts/im023_retrain_prithvi600m.py (R4's flags + variant switch + fraction head).
# Plan: docs/experiments/class-separability/retrain_barrblandskog.md (Prithvi-600M)
# Prereq: k8s/im023/prithvi600m/relabel-b28-job.yaml done. The full runs refuse until this passed.
#
# SHA is filled in after the push; the job refuses to start until then.
#   kubectl create --dry-run=server -f k8s/im023/prithvi600m/train-smoke-job.yaml
#   kubectl create -f k8s/im023/prithvi600m/train-smoke-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: im023-prithvi600m-smoke
  namespace: prithvi-training-default
  labels: { app: unified-training, purpose: im023-retrain, model: prithvi600m, variant: smoke }
spec:
  backoffLimit: 0
  # As R4: no Job-level deadline (it would count queue time); the run cap is
  # on the pod below and starts when the pod starts.
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: unified-training, purpose: im023-retrain, model: prithvi600m, variant: smoke }
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 10800   # 3 h cap for two epochs + setup
      nodeSelector:
        accelerator: nvidia-h100
      # As the IM-023 TESSERA jobs: srv02's GPU admission was desynced (2026-08-09).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [p02r08srv02]
      containers:
        - name: trainer
          image: python:3.11-slim@sha256:d1e9ca7c4e78d1e8ecadb5d44bfc8e956e7a65b659a9950f569f243d72b326d0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              export PYTHONUNBUFFERED=1
              SHA=4615c3d9c7bf974e486176c9f47a1a193573b039
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: source not pinned (SHA=$SHA)"; exit 1; }
              echo "=== im023-prithvi600m-smoke — $(date -u) ==="
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              pip install --quiet --no-cache-dir torch==2.5.1 torchvision==0.20.1 \
                --index-url https://download.pytorch.org/whl/cu121
              pip install --quiet --no-cache-dir timm numpy scipy scikit-learn huggingface_hub
              mkdir -p /workspace && cd /workspace
              git init -q imintengine && cd imintengine
              git remote add origin https://github.com/TobiasEdman/ImintEngine.git
              git fetch -q --depth 1 origin "$SHA"
              git checkout -q "$SHA"
              test "$(git rev-parse HEAD)" = "$SHA"
              echo "PINNED SOURCE: $SHA"
              pip install --no-cache-dir -e '.[training]' || pip install --quiet --no-cache-dir -r requirements.txt
              RETRAIN=/workspace/imintengine/scripts/im023_retrain_prithvi600m.py
              cd /cephfs
              # --- run ---
              # _SMOKE_OK names the commit that passed; the full runs require it to be theirs.
              python3 "$RETRAIN" --variant main --epochs 1 --checkpoint-dir "/cephfs/checkpoints/im023/prithvi600m_smoke_main_${SHA:0:12}"
              echo "$SHA" > /cephfs/checkpoints/im023/prithvi600m_smoke_main_${SHA:0:12}/_SMOKE_OK
              python3 "$RETRAIN" --variant control --epochs 1 --checkpoint-dir "/cephfs/checkpoints/im023/prithvi600m_smoke_control_${SHA:0:12}"
              echo "$SHA" > /cephfs/checkpoints/im023/prithvi600m_smoke_control_${SHA:0:12}/_SMOKE_OK
              echo "=== Done: $(date -u) ==="
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cephfs
              mountPath: /cephfs
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cephfs
          persistentVolumeClaim:
            claimName: training-data-cephfs
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
