---
# IM-023 item 4: LUCAS for the three IM-023 cells (im023_main 29 classes,
# im023_control 28, R4). scripts/validate_against_lucas.py with --fraction
# --fold-28: a predicted barrblandskog (28) is scored as tallskog or
# granskog by the fraction head's tall vs gran share, the rule of the NFI
# amendment, and the 28 column is reported without a score. Control and R4
# get the same rule (they predict no 28). LUCAS is diagnostic, not sealed;
# the log records each checkpoint's sha256.
#
# Runtime: the sealed image of the NFI amendment (see
# nfi-amendment-prepare-job.yaml), under the model interpreter. The validator
# has no sealed-runtime check of its own, so the Job first runs the image's
# fail-closed preflight (docker/ladder-crop-distill/README.md, "Runtime
# verification") and logs the verified identity.
#
# Writes: /cephfs/ladder_eval/im023/lucas_2026-11-06/ only. The validator
# writes into the Pod's emptyDir and prints its results there; the log shows
# progress lines only (results stay private). Each cell's JSON and per-point
# parquet are then copied by exclusive create. A failed cell is reported, the
# next still runs, and the Job fails at the end. Root, as the other IM-023
# eval Jobs. 2080 Ti.
# Placeholders, filled in the pin commit after the merge:
#   REPLACE_WITH_SEALED_IMAGE_DIGEST  the published image's digest
#   REPLACE_WITH_MERGED_SHA           the commit baked into that image
# Not applied by the author: kubectl create --dry-run=server -f <this file>.
apiVersion: batch/v1
kind: Job
metadata:
  name: im023-eval-lucas
  namespace: prithvi-training-default
  labels: {app: unified-training, purpose: im023-eval, model: tessera}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: unified-training, purpose: im023-eval, model: tessera}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-push
      nodeSelector: {accelerator: nvidia-gtx-2080ti}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: run
          image: ghcr.io/tobiasedman/imint-ladder-crop-distill@sha256:REPLACE_WITH_SEALED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              OUT=/cephfs/ladder_eval/im023/lucas_2026-11-06
              echo "=== IM-023 LUCAS — $(date -u) ==="
              /usr/local/bin/python /opt/imintengine/scripts/crop_distill_provenance.py verify-runtime \
                --source-git-sha "$SOURCE_GIT_SHA" --image-ref "$IMAGE_REF" \
                --runtime-manifest /opt/provenance/runtime.json
              nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true
              chmod 0755 "$OUT"
              FAILED=""
              for CELL in im023_main im023_control r4; do
                case "$CELL" in
                  im023_main) CKPT=/cephfs/checkpoints/im023/tessera_b28/best_model.pt ;;
                  im023_control) CKPT=/cephfs/checkpoints/im023/tessera_control/best_model.pt ;;
                  r4) CKPT=/cephfs/checkpoints/ladder/tessera_r4/best_model.pt ;;
                esac
                JSON="lucas-validation-$CELL.json"
                POINTS="lucas-per-point-$CELL.parquet"
                if [ -e "$OUT/$JSON" ] || [ -e "$OUT/$POINTS" ]; then
                  echo "$CELL: output already exists; refusing to overwrite"
                  FAILED="$FAILED $CELL"; continue
                fi
                mkdir -p "/scratch/$CELL"
                echo "$CELL: checkpoint sha256 $(sha256sum "$CKPT" | cut -d' ' -f1)"
                T0=$(date +%s)
                set +e
                /opt/venvs/model/bin/python -u /opt/imintengine/scripts/validate_against_lucas.py \
                  --checkpoint "$CKPT" --backbone-name tessera_v1 --img-size 504 --num-classes 28 \
                  --data-dir /cephfs/unified_v2_512 --lucas-index /cephfs/lucas/lucas_tile_index.parquet \
                  --min-support 20 --fraction --fold-28 --device cuda \
                  --out "/scratch/$CELL/$JSON" --dump-per-point "/scratch/$CELL/$POINTS" \
                  > "/scratch/$CELL/validate.log" 2>&1
                STATUS=$?
                set -e
                echo "$CELL: validator exit $STATUS; wall seconds $(( $(date +%s) - T0 ))"
                # Progress lines only; the checkpoint's own val mIoU is cut, as
                # infer_nfi_amendment.py leaves it out.
                grep -E '^(LUCAS index:|dropping |crop offset=|  \[load_model\]|skipped |wrote )' "/scratch/$CELL/validate.log" \
                  | sed -E 's/ ckpt_mIoU=[^ ]+//' || true
                if [ "$STATUS" -ne 0 ]; then
                  grep -E '^(Traceback \(most recent call last\):|  File "[^"]*", line [0-9]+, in [A-Za-z_<>][A-Za-z0-9_<>]*|[A-Za-z_][A-Za-z0-9_.]*(Error|Exception|Exit)(: .{0,200})?)$' \
                    "/scratch/$CELL/validate.log" | tail -n 30 || true
                  FAILED="$FAILED $CELL"; continue
                fi
                if ! /usr/local/bin/python - "/scratch/$CELL" "$OUT" "$JSON" "$POINTS" <<'PY'
              import os, sys
              from pathlib import Path
              src, out, names = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3:]
              for name in names:
                  data = (src / name).read_bytes()
                  with open(out / name, "xb") as stream:
                      stream.write(data)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.chmod(out / name, 0o644)
                  print(f"{name}: {len(data)} bytes")
              PY
                then
                  FAILED="$FAILED $CELL"; continue
                fi
                echo "$CELL: published to $OUT"
              done
              echo "=== done — $(date -u); failed:${FAILED:- none} ==="
              [ -z "$FAILED" ]
          env:
            # The image again, and the commit baked into it, for the preflight.
            - {name: IMAGE_REF, value: "ghcr.io/tobiasedman/imint-ladder-crop-distill@sha256:REPLACE_WITH_SEALED_IMAGE_DIGEST"}
            - {name: SOURCE_GIT_SHA, value: REPLACE_WITH_MERGED_SHA}
            - {name: HOME, value: /scratch}
            - {name: TMPDIR, value: /scratch}
            - {name: XDG_CACHE_HOME, value: /scratch/.cache}
            - {name: MPLCONFIGDIR, value: /scratch/.mpl}
            - {name: TORCH_HOME, value: /scratch/.torch}
            - {name: TORCHINDUCTOR_CACHE_DIR, value: /scratch/.inductor}
            - {name: TRITON_CACHE_DIR, value: /scratch/.triton}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          resources:
            requests: {cpu: "4", memory: 24Gi, ephemeral-storage: 24Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 24Gi, ephemeral-storage: 24Gi, nvidia.com/gpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            # Everything read-only except the new LUCAS directory.
            - {name: data, mountPath: /cephfs, readOnly: true}
            - {name: data, mountPath: /cephfs/ladder_eval/im023/lucas_2026-11-06, subPath: ladder_eval/im023/lucas_2026-11-06}
            - {name: scratch, mountPath: /scratch}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: training-data-cephfs}
        - name: scratch
          emptyDir: {sizeLimit: 20Gi}
