apiVersion: batch/v1
kind: Job
metadata:
  name: era5-p600m-control-d7222a0a32c4
  namespace: prithvi-training-default
  labels:
    app: unified-training
    purpose: era5-prithvi600m-smoke
    arm: control
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: unified-training
        purpose: era5-prithvi600m-smoke
        arm: control
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-push
      activeDeadlineSeconds: 43200
      nodeSelector:
        accelerator: nvidia-h100
        kubernetes.io/hostname: p02r08srv01
      containers:
        - name: trainer
          image: ghcr.io/tobiasedman/imint-era5-smoke@sha256:95813c0d59b2489da9b2878f7d7d4e4aefa73262c3f86dca9cf516b5fc37506e
          command: ["/bin/bash", "/patches/run_arm.sh"]
          env:
            - name: ARM
              value: control
            - name: RUN_ID
              # New cohort epoch AND new code bundle.
              # Epoch: the 2026-08-21 cohort was sealed against tiles the VPP
              # gap-fill has since rewritten (2,147 of them), so
              # validate_existing_cohort refused it — correctly.
              # Bundle: 98f2dbb changed era5_aux.py (ERA5-Land has no water
              # coverage, cell 25/384 came back all-NaN), and era5_aux.py is
              # hash-verified, so the suffix moved 7b5c190221fb -> d7222a0a32c4.
              # Both arms must therefore re-run under this RUN_ID; the earlier
              # control seeds 41/42/43 (median 0.2920) live under the old one.
              # build_cohort.py is byte-identical across the two bundles, so the
              # cohort must reproduce cohort_sha256 e9b45d03... — if it does
              # NOT, stop: the arms are no longer paired on identical tiles.
              value: era5-p600m-20260826-d7222a0a32c4
            # The control arm now reaches Open-Meteo too. It does not fetch
            # ERA5 features, but the cohort build probes ERA5-Land coverage for
            # its candidates (--era5-land-probe-cache), which discloses the same
            # tile coordinates the treatment arm discloses. That disclosure is
            # what this flag governs, so control must declare it rather than
            # inherit an exemption it no longer qualifies for.
            - name: ALLOW_OPEN_METEO_TILE_METADATA
              value: "yes"
            - name: BASE_GIT_SHA
              value: 602c86dee8d4dbdc191ab2750c261cf86b56ac50
            - name: CONTAINER_IMAGE
              value: ghcr.io/tobiasedman/imint-era5-smoke@sha256:95813c0d59b2489da9b2878f7d7d4e4aefa73262c3f86dca9cf516b5fc37506e
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cephfs
              mountPath: /cephfs
              readOnly: true
            - name: checkpoints
              mountPath: /checkpoints
            - name: training-data
              mountPath: /data
              readOnly: true
            - name: patches
              mountPath: /patches
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cephfs
          persistentVolumeClaim:
            claimName: training-data-cephfs
        - name: checkpoints
          persistentVolumeClaim:
            claimName: training-checkpoints
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data
        - name: patches
          configMap:
            name: era5-smoke-code-d7222a0a32c4
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
