apiVersion: batch/v1
kind: Job
metadata:
  name: era5-p600m-control-2202d142db81
  namespace: prithvi-training-default
  labels:
    app: unified-training
    purpose: era5-prithvi600m-smoke
    arm: control
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: unified-training
        purpose: era5-prithvi600m-smoke
        arm: control
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-push
      activeDeadlineSeconds: 43200
      nodeSelector:
        accelerator: nvidia-h100
        kubernetes.io/hostname: p02r08srv01
      containers:
        - name: trainer
          image: ghcr.io/tobiasedman/imint-era5-smoke@sha256:95813c0d59b2489da9b2878f7d7d4e4aefa73262c3f86dca9cf516b5fc37506e
          command: ["/bin/bash", "/patches/run_arm.sh"]
          env:
            - name: ARM
              value: control
            - name: RUN_ID
              # New cohort epoch AND new code bundle (7b5c19 -> 2202d142db81
              # via a3fe2d1f -> 22c89b41 -> d7222a0a).
              #
              # This cohort is DELIBERATELY DIFFERENT from every earlier one:
              # build_cohort.py now ranks cereal-bearing tiles first
              # (--prefer-cereal-tiles) and drops cells ERA5-Land does not cover
              # (--era5-land-probe-cache). So cohort_sha256 MUST NOT reproduce
              # e9b45d03... — a changed hash is the point, not a warning sign.
              # Earlier manifests said the opposite; that instruction applied
              # when only the bundle changed and the selection did not.
              #
              # Consequences to expect, and to check rather than assume:
              #   * control's mIoU will NOT be 0.2920 — that baseline belongs to
              #     the old uniform cohort. The new run establishes its own, and
              #     only the treatment-vs-control delta on THIS cohort is
              #     meaningful. Do not compare across cohorts.
              #   * vete/korn/havre should hold far more than the 13/30/19 val
              #     tiles the uniform draw gave them; if they do not, the
              #     ranking did not take effect and the crop question is still
              #     unanswerable.
              value: era5-p600m-20260826-2202d142db81
            # The control arm now reaches Open-Meteo too. It does not fetch
            # ERA5 features, but the cohort build probes ERA5-Land coverage for
            # its candidates (--era5-land-probe-cache), which discloses the same
            # tile coordinates the treatment arm discloses. That disclosure is
            # what this flag governs, so control must declare it rather than
            # inherit an exemption it no longer qualifies for.
            - name: ALLOW_OPEN_METEO_TILE_METADATA
              value: "yes"
            - name: BASE_GIT_SHA
              value: 602c86dee8d4dbdc191ab2750c261cf86b56ac50
            - name: CONTAINER_IMAGE
              value: ghcr.io/tobiasedman/imint-era5-smoke@sha256:95813c0d59b2489da9b2878f7d7d4e4aefa73262c3f86dca9cf516b5fc37506e
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cephfs
              mountPath: /cephfs
              readOnly: true
            - name: checkpoints
              mountPath: /checkpoints
            - name: training-data
              mountPath: /data
              readOnly: true
            - name: patches
              mountPath: /patches
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cephfs
          persistentVolumeClaim:
            claimName: training-data-cephfs
        - name: checkpoints
          persistentVolumeClaim:
            claimName: training-checkpoints
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data
        - name: patches
          configMap:
            name: era5-smoke-code-2202d142db81
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
