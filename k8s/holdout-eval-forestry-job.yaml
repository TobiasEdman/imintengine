---
# Step 2f: the twelve evaluation-copy tiles whose four SKG forestry channels
# (height, volume, basal_area, diameter) are all zero. Zero-filled aux is
# forbidden in this repo: a zero array behind a present key is a fetch that
# never happened, not a measurement.
#
# Fix first, exclude second: prefetch_aux --force re-fetches the four channels
# on every tile of the copy (SKG is free, no CDSE PU; the campaign took 19 min
# for 475 tiles). Tiles that are STILL all zero afterwards are a genuine
# Skogsstyrelsen coverage gap (water, non-forest, outside the raster) and are
# MOVED out of the copy to /data/holdout_eval_512_excluded/forestry_zero/
# — not deleted — with their names in a manifest, so the final census sees a
# copy whose every tile carries real forestry data. Tobias asked to be told
# which it was; the manifest and the log say.
#
# Needs the skg-endpoints Secret at /etc/skg (the 2024 SKG run failed on all
# 475 tiles without it). Runs ONLY on /data/holdout_eval_512.
apiVersion: batch/v1
kind: Job
metadata:
  name: holdout-eval-forestry
  namespace: prithvi-training-default
  labels: {app: fieldtruth-prep, purpose: holdout-eval}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600   # 6 h
  template:
    metadata:
      labels: {app: fieldtruth-prep}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: forestry
          image: python:3.11-slim@sha256:5be45dbade29bebd6886af6b438fd7e0b4eb7b611f39ba62b430263f82de36d2
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              export PYTHONUNBUFFERED=1
              DIR=/data/holdout_eval_512
              echo "=== forestry re-fetch, evaluation copy — $(date -u) ==="
              test -f /data/manifests/holdout_eval_512_copy.json || { echo "REFUSING: no copy manifest"; exit 1; }
              apt-get update -qq && apt-get install -y -qq git libgdal-dev gdal-bin >/dev/null 2>&1
              pip install -q --no-cache-dir numpy scipy rasterio pyproj requests shapely pandas pyarrow Pillow
              mkdir -p /workspace && cd /workspace
              git clone -q --depth 1 --branch main https://github.com/TobiasEdman/ImintEngine.git ie
              cd ie
              export PYTHONPATH=/workspace/ie:${PYTHONPATH:-}
              echo "HEAD: $(git rev-parse HEAD)"
              cp /etc/skg/skg_endpoints /workspace/ie/.skg_endpoints
              echo "endpoint urls configured: $(grep -c url /workspace/ie/.skg_endpoints)"
              python scripts/prefetch_aux.py --help > /dev/null && echo "imports OK"

              python - <<'PYEOF'
              import glob, json
              import numpy as np
              KEYS = ("height", "volume", "basal_area", "diameter")
              zero = sorted(p.split("/")[-1][:-4] for p in glob.glob("/data/holdout_eval_512/*.npz")
                            if all(not np.any(np.load(p, allow_pickle=True)[k]) for k in KEYS))
              print(f"all-zero forestry before: {len(zero)}")
              json.dump(zero, open("/tmp/zero_before.json", "w"))
              PYEOF

              BEFORE=$(ls $DIR/*.npz | wc -l); echo "TILES BEFORE: $BEFORE"
              python scripts/prefetch_aux.py --data-dir "$DIR" \
                --channels height volume basal_area diameter --workers 8 --force
              AFTER=$(ls $DIR/*.npz | wc -l); echo "TILES AFTER: $AFTER"
              [ "$BEFORE" = "$AFTER" ] || { echo "FAIL: tile count changed"; exit 1; }

              python - <<'PYEOF'
              import glob, json, os, time
              import numpy as np
              KEYS = ("height", "volume", "basal_area", "diameter")
              DIR = "/data/holdout_eval_512"
              OUT = "/data/holdout_eval_512_excluded/forestry_zero"
              before = json.load(open("/tmp/zero_before.json"))
              still = sorted(p.split("/")[-1][:-4] for p in glob.glob(f"{DIR}/*.npz")
                             if all(not np.any(np.load(p, allow_pickle=True)[k]) for k in KEYS))
              fixed = sorted(set(before) - set(still))
              print(f"all-zero forestry after re-fetch: {len(still)}; fixed by re-fetch: {len(fixed)}")
              os.makedirs(OUT, exist_ok=True)
              for name in still:
                  os.replace(f"{DIR}/{name}.npz", f"{OUT}/{name}.npz")
              json.dump({"dir": DIR, "zero_before": before, "fixed_by_refetch": fixed,
                         "excluded_still_zero": still, "excluded_to": OUT,
                         "verified": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())},
                        open("/data/manifests/holdout_eval_512_forestry.json", "w"), indent=1)
              print(f"excluded (moved, not deleted): {still}")
              print(f"tiles remaining in the copy: {len(glob.glob(f'{DIR}/*.npz'))}")
              PYEOF
              echo "=== done: $(date -u) ==="
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources:
            requests: {cpu: "8", memory: "24Gi"}
            limits: {cpu: "8", memory: "24Gi"}
          volumeMounts:
            - {name: d, mountPath: /data}
            - {name: skg-endpoints, mountPath: /etc/skg, readOnly: true}
      volumes:
        - name: d
          persistentVolumeClaim: {claimName: training-data-cephfs}
        - name: skg-endpoints
          secret: {secretName: skg-endpoints}
