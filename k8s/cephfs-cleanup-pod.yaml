apiVersion: v1
kind: Pod
metadata:
  name: cephfs-cleanup
  namespace: prithvi-training-default
  labels:
    app: ops
    purpose: cephfs-cleanup
spec:
  restartPolicy: Never
  containers:
    - name: cleanup
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -e
          BK=/data/unified_v2_512_pre_recoreg_20260629T064528Z
          echo "=== before ==="; df -h /data | tail -1
          echo "target tiles: $(ls "$BK" 2>/dev/null | wc -l)"
          echo "live tiles (must stay): $(ls /data/unified_v2_512 | wc -l)"
          echo "=== deleting pre-recoreg backup ($BK) ==="
          rm -rf "$BK"
          echo "=== after ==="; df -h /data | tail -1
          ls -d "$BK" 2>/dev/null && echo "STILL THERE" || echo "backup removed OK"
          echo "live tiles after: $(ls /data/unified_v2_512 | wc -l)"
          sleep 3600
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "1Gi"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: training-data-cephfs
