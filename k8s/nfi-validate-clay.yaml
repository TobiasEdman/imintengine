# NFI field validation — Clay v1.5 ensemble member (28-class, frac head).
#
# Mirrors k8s/nfi-validate-tessera-job.yaml but routes a Clay checkpoint
# through the SAME validate_against_nfi.py → inference_comparison path. The
# routed-family support (Clay/CROMA/TerraMind) lands in
# scripts/inference_comparison.py: _build_inference_inputs builds the s2_clay
# stack via UnifiedDataset._build_model_specific_tensors and forwards through
# imint.fm.forward_router.family_forward — the exact input-building + routing
# the trainer used, so validation is bit-parity with training.
#
# Clay specifics vs. the tessera job:
#   * pip install git+Clay-foundation/model  (the claymodel package)
#   * requires the base weights at /data/model_cache/clay-v1.5.ckpt AND the
#     metadata yaml — build_backbone(pretrained=False) still constructs the
#     Clay MAE architecture via ClayMAEModule.load_from_checkpoint before the
#     seg checkpoint's encoder.* weights overwrite it (same as train-clay-job).
#   * --backbone-name clay_v1_5 is what makes load_model build the Clay seg
#     model (ClaySegmentationModel + ViTUPerNetHead) rather than a Prithvi one.
#   * Clay is optical-only — no S1 needed (works NOW; CROMA/TerraMind wait for
#     the v2 S1 season composite).
#
# Author-only: do NOT apply until the branch is pushed. Launch command is in
# the session hand-off.
apiVersion: batch/v1
kind: Job
metadata:
  name: nfi-validate-clay
  namespace: prithvi-training-default
  labels:
    app: ensemble-prep
    purpose: nfi-validate-clay
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800   # 3h — Clay ViT-L inference is heavier
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: ensemble-prep
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia-gtx-2080ti
      containers:
        - name: validate
          image: python:3.11-slim
          command:
            - bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== NFI validation — Clay v1.5 member (28-class) ==="
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              pip install --quiet --no-cache-dir torch torchvision \
                --index-url https://download.pytorch.org/whl/cu121
              pip install --quiet --no-cache-dir \
                timm einops numpy Pillow scipy scikit-learn huggingface_hub \
                pandas pyarrow rasterio pyproj
              # Clay v1.5 encoder architecture lives in the claymodel package.
              pip install --quiet --no-cache-dir \
                "git+https://github.com/Clay-foundation/model.git"

              mkdir -p /workspace && cd /workspace
              BRANCH=agent/te/opus/nfi-nmd2023-benchmark
              git clone --depth 1 --branch "$BRANCH" \
                https://github.com/TobiasEdman/ImintEngine.git imintengine
              cd /workspace/imintengine
              pip install --no-cache-dir -e . --no-deps 2>/dev/null || true
              echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"

              # Fail loud unless the routed-family inference support is on the
              # clone (a clone predating this work cannot run Clay).
              grep -q '_ROUTED_FAMILIES' scripts/inference_comparison.py \
                || { echo "FATAL: routed-family inference missing on clone"; exit 1; }
              grep -q 'backbone_name=backbone_name' scripts/validate_against_nfi.py \
                || { echo "FATAL: --backbone-name override missing on clone"; exit 1; }
              [ -f /data/checkpoints/clay/best_model.pt ] \
                || { echo "FATAL: clay checkpoint not found"; exit 1; }
              [ -f /data/model_cache/clay-v1.5.ckpt ] \
                || { echo "FATAL: clay base weights not at /data/model_cache"; exit 1; }

              OUT=/data/nfi_eval/nfi_validation_clay.json
              PP=/data/nfi_eval/clay_per_plot.parquet
              python3 scripts/validate_against_nfi.py \
                --checkpoint /data/checkpoints/clay/best_model.pt \
                --backbone-name clay_v1_5 \
                --plot-index /data/nfi/nfi_index_unified_v2_512.parquet \
                --img-size 504 \
                --num-classes 28 \
                --use-fraction-head \
                --out "$OUT" \
                --dump-per-plot "$PP" \
                --device cuda

              echo ""; echo "=== validation JSON ==="; cat "$OUT"
              echo ""; echo "=== Done: $(date) ==="
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: training-data-cephfs
