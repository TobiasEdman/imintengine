---
# Source: pinned to main d4d24f9 (the code this plan was reviewed against)
# with a SHA-256 check of every script it runs; main has since moved
# (engine-package refactor, PR #59). Decision 2026-10-13.
#
# Step 3h: frame_2016 for the top-up tiles, per staging root. Same pipeline,
# image and gate as sen2cor-frame2016-holdout-eval-job.yaml (select_scenes
# 2016 with 2015 fallback, run_sen2cor_per_scene, COT gate 8.0 on the GPU,
# RTX 2080 Ti only, one device). Nothing relaxed. The pod's wall time with
# the GPU attached is the GPU-hour figure to report against D4's ~30 GPU-h;
# the campaign needed ~1.75 GPU-h per 100 tiles. PU-free.
apiVersion: batch/v1
kind: Job
metadata:
  name: sen2cor-frame2016-topup
  namespace: prithvi-training-default
  labels: {app: fieldtruth-prep, purpose: nfi-topup}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels: {app: fieldtruth-prep}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-push
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: ["NVIDIA-GeForce-RTX-2080-Ti"]
      containers:
        - name: pipeline
          image: ghcr.io/tobiasedman/imint-sen2cor@sha256:528adef18445404c6f491ff2f8a81f3d75f908280704d69c2c507f820f59de28
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              export PYTHONUNBUFFERED=1
              echo "=== sen2cor frame_2016, top-up roots — $(date -u) ==="
              apt-get update -qq && apt-get install -y -qq git python3 python3-pip libgdal-dev gdal-bin > /dev/null 2>&1
              pip3 install --quiet --no-cache-dir numpy rasterio pyproj requests Pillow pystac-client openeo torch 2>&1 | tail -1
              mkdir -p /workspace && cd /workspace
              git clone --depth 1 --branch main https://github.com/TobiasEdman/ImintEngine.git ie
              cd ie
              git fetch -q --depth 1 origin "$SCRIPTS_COMMIT"
              git checkout -q "$SCRIPTS_COMMIT"
              test "$(git rev-parse HEAD)" = "$SCRIPTS_COMMIT" || { echo "REFUSING: HEAD is not $SCRIPTS_COMMIT"; exit 1; }
              printf '%s\n' "$SCRIPTS_SHA256" | sha256sum -c -   # the reviewed bytes of every script this Job runs
              export PYTHONPATH=/workspace/ie:${PYTHONPATH:-}
              echo "HEAD: $(git rev-parse HEAD)"
              python3 scripts/sen2cor_pipeline/select_scenes.py --help > /dev/null
              python3 scripts/sen2cor_pipeline/run_sen2cor_per_scene.py --help > /dev/null
              echo "imports OK"
              nvidia-smi --query-gpu=name --format=csv,noheader || { echo "FAIL: no GPU device"; exit 1; }
              for Y in $YEARS; do
                DIR=/data/unified_v2_512_nfi${Y}_staging
                [ -d "$DIR" ] || { echo "$Y: no staging root, skipping"; continue; }
                PLAN=/data/debug/sen2cor_frame2016_nfi${Y}_topup_plan.json
                echo ""; echo "######## $Y ########  $(date -u)"
                python3 scripts/sen2cor_pipeline/select_scenes.py --data-dir "$DIR" --year 2016 --fallback-year 2015 --workers 16 --out "$PLAN"
                python3 -c "
              import json; p = json.load(open('$PLAN'))
              print(f\"  plan: scenes={p['n_scenes']} covered={p['n_tiles_covered']} unassigned={len(p['unassigned'])}\")"
                python3 scripts/sen2cor_pipeline/run_sen2cor_per_scene.py --plan "$PLAN" --data-dir "$DIR" \
                  --safe-cache /data/sen2cor_cache --cot-max 8.0 --workers 4 --device cuda
                python3 -c "
              import glob, numpy as np
              n = sum(int(np.load(p, allow_pickle=True).get('has_frame_2016', 0)) == 1 for p in glob.glob('$DIR/*.npz'))
              print(f'  $Y: has_frame_2016=1 on {n} of {len(glob.glob(\"$DIR/*.npz\"))} tiles')"
              done
              echo "=== done: $(date -u) ==="
          env:
            - {name: SCRIPTS_COMMIT, value: "d4d24f9ab1581ecdc8db739d4271905806401b6a"}   # main as reviewed for this plan; pinned 2026-10-13
            - {name: SCRIPTS_SHA256, value: "351538d1f676d290b99285200adb7469b8f85fd5774bf2c39bd32844e2c15339  scripts/sen2cor_pipeline/select_scenes.py\n3ee7f52c9c367603ae469ecf164839e4660820253193553bcc9134cfa913edde  scripts/sen2cor_pipeline/run_sen2cor_per_scene.py"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: YEARS, value: "2018 2019 2021 2022"}
          resources:
            requests: {cpu: "24", memory: "64Gi"}
            limits: {cpu: "24", memory: "64Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: d, mountPath: /data}
      volumes:
        - name: d
          persistentVolumeClaim: {claimName: training-data-cephfs}
