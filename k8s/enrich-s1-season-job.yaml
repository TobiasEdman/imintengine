# S1 SAR season-composite enrichment (v2) over /data/unified_v2_512.
#
# Replaces the ±3-day-per-frame S1 stack with TWO per-orbit median season
# composites per tile (label-year growing season + 2016 clearcut anchor).
# See docs/plans/s1_monthly_enrichment.md.
#
# Backend: CDSE STAC + direct-COG + local σ⁰ calibration
# (imint.training.cdse_s1_stac). Bills OData bandwidth (12 TB/mo) + COG
# requests (50k/mo) — NOT the shared PU pool. Product COGs are cached on the
# PVC ($S1_CACHE_DIR) so adjacent tiles reuse scenes (real request count far
# below the naive 2×tiles×3 estimate).
#
# Downloads use the CDSE resource-owner PASSWORD grant (CDSE_USER +
# CDSE_PASSWORD from the cdse-credentials secret) — the client_credentials
# service account 401s on the OData download nodes (noted 2026-08-04 in
# enrich-s1-job.yaml). STAC search stays anonymous.
#
# Smoke: set the command's `--limit 5` to process 5 real tiles as the
# go/no-go evidence. Remove --limit for the full 7,882-tile run (launched
# only after a CDSE budget check — do NOT auto-launch full).
apiVersion: batch/v1
kind: Job
metadata:
  name: enrich-s1-season
  namespace: prithvi-training-default
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 172800  # 48h
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # srv04/srv06 = runc pod-sandbox bug + observed OOM host
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["p02r09srv04", "p02r09srv06"]
      containers:
        - name: enricher
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== S1 SAR season-composite enrichment (v2) ==="

              apt-get update -qq && apt-get install -y -qq git libgdal-dev gdal-bin > /dev/null 2>&1
              pip install --quiet --no-cache-dir numpy scipy rasterio requests pyproj pyyaml Pillow httpx pystac-client

              mkdir -p /workspace && cd /workspace
              git clone --depth 1 --branch agent/te/opus/nfi-nmd2023-benchmark \
                https://github.com/TobiasEdman/ImintEngine.git imintengine
              cd /workspace/imintengine
              echo "HEAD: $(git rev-parse HEAD)"
              pip install --no-cache-dir -e . --no-deps 2>/dev/null || true

              mkdir -p "$S1_CACHE_DIR"

              # --limit 5  ← SMOKE. Remove for the full run (after CDSE budget check).
              # --workers 2: CDSE STAC's Cloudflare WAF rate-limits by source
              # IP (all workers share the pod IP), so search concurrency — not
              # CPU/mem — is the binding constraint. 2 workers + the process-
              # global search throttle (S1_STAC_MIN_INTERVAL_S) keeps us under
              # the WAF's rate instead of bouncing off 429s into multi-minute
              # backoff sleeps. Downloads (2 GB COGs, cached on the PVC) are
              # the wall-time cost, not searches.
              python scripts/enrich_tiles_s1.py \
                --data-dir /data/unified_v2_512 \
                --workers 2 \
                --skip-existing

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: S1_CACHE_DIR
              value: "/data/s1_cache"
            # Min seconds between STAC searches, process-global (WAF is per-IP).
            - name: S1_STAC_MIN_INTERVAL_S
              value: "1.5"
            # LRU cache cap — uncapped the product cache hit 317 GB and
            # filled the 1.6T PVC mid-run (2026-08-17). ~150 GB keeps strong
            # scene-sharing while leaving the volume >150 GB of headroom.
            - name: S1_CACHE_MAX_GB
              value: "150"
            # Client-credentials pair (STAC search + client-credentials token).
            - name: CDSE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: client_id
            - name: CDSE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: client_secret
            # Password grant for the download nodes (see header).
            - name: CDSE_USER
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: user
            - name: CDSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdse-credentials
                  key: password
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
            limits:
              cpu: "4"
              memory: "24Gi"
          volumeMounts:
            - name: training-data
              mountPath: /data
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-cephfs
