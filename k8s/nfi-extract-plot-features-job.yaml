apiVersion: batch/v1
kind: Job
metadata:
  name: nfi-extract-plot-features
  namespace: prithvi-training-default
  labels:
    app: ensemble-prep
    purpose: nfi-extract-plot-features
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: ensemble-prep
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia-gtx-2080ti
      containers:
        - name: validate
          image: python:3.11-slim
          command:
            - bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== NFI validation — plot-feature extract (hybrid experiment) ==="
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              pip install --quiet --no-cache-dir torch torchvision \
                --index-url https://download.pytorch.org/whl/cu121
              pip install --quiet --no-cache-dir \
                timm einops numpy Pillow scipy scikit-learn huggingface_hub \
                pandas pyarrow rasterio pyproj

              mkdir -p /workspace && cd /workspace
              BRANCH=agent/te/opus/nfi-nmd2023-benchmark
              git clone --depth 1 --branch "$BRANCH" \
                https://github.com/TobiasEdman/ImintEngine.git imintengine
              cd /workspace/imintengine
              pip install --no-cache-dir -e . --no-deps 2>/dev/null || true
              echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"

              grep -q 'register_preclassifier_hook' scripts/extract_plot_features.py \
                || { echo "FATAL: extract script missing on clone"; exit 1; }
              OUT=/data/nfi_eval/nfi_plot_features_nmd2023.parquet
              python3 scripts/extract_plot_features.py \
                --checkpoint /data/checkpoints/v8b_nmd2023_long/best_model.pt \
                --plot-index /data/nfi/nfi_index_unified_v2_512.parquet \
                --img-size 504 \
                --out "$OUT" \
                --device cuda

              echo ""; echo "=== output check ==="
              ls -lh "$OUT"
              python3 -c "import pandas as pd; d=pd.read_parquet('$OUT'); print(d.shape); print(d['nfi_forest'].value_counts().sort_index().to_dict())"
              echo ""; echo "=== Done: $(date) ==="
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: training-data-cephfs
