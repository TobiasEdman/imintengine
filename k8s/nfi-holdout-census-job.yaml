---
# Step 1 of the multi-year NFI control-tile plan (PR #69): READ-ONLY census of
# the legacy /data/holdout_val_512 tiles, the lever that could cover 2019,
# 2020 and 2023 without a new fetch. Decision D3 (Tobias, 2026-10-11) allows
# reusing it only after this check proves it was never used for training or
# model selection and shows what the tiles carry.
#
# Mirrors k8s/nfi2024-key-census-job.yaml (key presence, all-zero arrays,
# positive flag on an empty array) and k8s/nfi-cover-estimate-job.yaml
# (CPU-only, plots counted on tiles) in one pass, through
# scripts/census_holdout_val_512.py. See that script's docstring for what is
# measured. The PVC is mounted readOnly at volume and mount level: nothing
# under /data can be written, by design and by the kernel. The report is
# written to the container filesystem and echoed to the log between
# CENSUS_JSON_BEGIN/END markers; the committed copy lives under
# docs/experiments/ with the job and pod ids and the log hash.
#
# Source identity is pinned three ways: this repo at CENSUS_COMMIT,
# imint/eval/fieldtruth.py at the task-0103 sizing's process commit (the
# script refuses any other sha256 — the 841-plot-year teacher exclusion is
# defined by that file), and the sizing JSON at the commit that published it
# (every input hash and the union size must match, or the job fails).
#
# The 84 files a non-root process cannot read: this Job runs as root, like
# nfi2024-key-census2, so it reads them and reports them separately
# (not world-readable, by year). Whether to count them is Tobias's call.
#
# v3 (2026-10-12, after Codex's second review): parsed files account only for
# the names they extracted, holdout-directory mentions in training territory
# keep the verdict open. v2 (after the first review): the script fails closed
# on unparsed split files and unclassified text evidence, quarantines tiles
# with contradictory years, names its verdict as named-tile evidence with
# spatial independence beside it, and reports the view that excludes tiles
# overlapping a same-year training tile (decision 2026-10-12). The first
# run is Job nfi-holdout-census (uid b1bcbfbf-…); this rerun regenerates the
# committed record from the corrected code. Still read-only, PVC readOnly.
#
# Scale: 1,463 tiles decompressed once (census2 took 18.7 min for 475) plus
# 7,882 cohort headers for the footprint check, so ~2 h; deadline 5 h.
# Aggregates only: no plot identity or coordinate reaches the log.
apiVersion: batch/v1
kind: Job
metadata:
  name: nfi-holdout-census-v3
  namespace: prithvi-training-default
  labels: {app: fieldtruth-prep, purpose: holdout-census}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 18000
  template:
    metadata:
      labels: {app: fieldtruth-prep}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: census
          image: python:3.11-slim@sha256:5be45dbade29bebd6886af6b438fd7e0b4eb7b611f39ba62b430263f82de36d2
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              export PYTHONUNBUFFERED=1
              echo "=== holdout_val_512 census — $(date -u) ==="
              apt-get update -qq && apt-get install -y -qq git libgdal-dev gdal-bin >/dev/null 2>&1
              pip install -q --no-cache-dir numpy pandas pyarrow rasterio pyproj openpyxl
              pip list --format=freeze 2>/dev/null | grep -i -E "^(numpy|pandas|pyarrow|rasterio|pyproj)="

              mkdir -p /workspace && cd /workspace
              git clone -q --depth 1 --branch "$CENSUS_BRANCH" \
                https://github.com/TobiasEdman/ImintEngine.git ie
              cd ie
              git fetch -q --depth 1 origin "$CENSUS_COMMIT" "$FIELDTRUTH_COMMIT" "$SIZING_COMMIT"
              git checkout -q "$CENSUS_COMMIT"
              echo "HEAD: $(git rev-parse HEAD)"
              # Codex's identity module and sizing record, read-only, at the
              # commits the sizing cites. Neither file is on this branch.
              git checkout -q "$FIELDTRUTH_COMMIT" -- imint/eval/fieldtruth.py
              git show "$SIZING_COMMIT:docs/experiments/nfi_fieldtruth_0103_tile_sizing_20261008.json" \
                > /workspace/codex_sizing.json
              sha256sum imint/eval/fieldtruth.py /workspace/codex_sizing.json
              export PYTHONPATH=/workspace/ie:${PYTHONPATH:-}

              echo "=== import smoke ==="
              python scripts/census_holdout_val_512.py --help > /dev/null
              echo "imports OK"

              python scripts/census_holdout_val_512.py \
                --data-root /data \
                --expected-sizing /workspace/codex_sizing.json \
                --out-json /workspace/holdout_census.json

              echo "=== CENSUS_JSON_BEGIN ==="
              cat /workspace/holdout_census.json
              echo ""
              echo "=== CENSUS_JSON_END ==="
              echo "=== done: $(date -u) ==="
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: CENSUS_BRANCH, value: "agent/te/claude/nfi-multiyear-census"}
            - {name: CENSUS_COMMIT, value: "532df9aefa113e24272a36dd6a61f0119d360ad3"}
            - {name: FIELDTRUTH_COMMIT, value: "ba31235c6bb5f4c2fa9d5c71929926a0023d062b"}
            - {name: SIZING_COMMIT, value: "94b26bbbef9d28220734e4efce38ed4943fd6157"}
          resources:
            requests: {cpu: "8", memory: "24Gi"}
            limits: {cpu: "8", memory: "24Gi"}
          volumeMounts:
            - {name: d, mountPath: /data, readOnly: true}
      volumes:
        - name: d
          persistentVolumeClaim: {claimName: training-data-cephfs, readOnly: true}
