# Compare TESSERA windows read from the published Zarr store (geotessera
# zarr/v1, dataset 1.0 "vultr") with the cohort's stored embeddings, which
# came from the same dataset's NPY tiles through geotessera 0.10.2.
#
# Read-only on the cohort. Writes only the Zarr window cache and the report:
#   /cephfs/tessera_zarr_cache/
#   /cephfs/tessera_zarr_compare/<UTC time>/report.json
# Needs outbound HTTPS to data.source.coop; without it the first read fails
# loudly. No CDSE processing units, no GPU.
#
#   kubectl create --dry-run=server -f k8s/tessera-zarr-compare-job.yaml
#   kubectl create -f k8s/tessera-zarr-compare-job.yaml
#   kubectl -n prithvi-training-default logs -f job/tessera-zarr-compare
apiVersion: batch/v1
kind: Job
metadata:
  name: tessera-zarr-compare
  namespace: prithvi-training-default
  labels: { app: ops, purpose: tessera-zarr-compare }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200   # 2 h cap; 20 windows of 512 px read over HTTPS
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: ops, purpose: tessera-zarr-compare }
    spec:
      restartPolicy: Never
      containers:
        - name: compare
          image: python:3.11-slim@sha256:d1e9ca7c4e78d1e8ecadb5d44bfc8e956e7a65b659a9950f569f243d72b326d0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              export PYTHONUNBUFFERED=1
              SHA=254bcc792821a584b51d3375684a2ac0d88c8dd0
              echo "=== tessera-zarr-compare — $(date -u) ==="
              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              pip install --quiet --no-cache-dir numpy rasterio pyproj shapely \
                zarr==3.1.3 "fsspec[http]==2025.9.0"
              mkdir -p /workspace && cd /workspace
              git init -q imintengine && cd imintengine
              git remote add origin https://github.com/TobiasEdman/ImintEngine.git
              git fetch -q --depth 1 origin "$SHA"
              git checkout -q "$SHA"
              test "$(git rev-parse HEAD)" = "$SHA"
              echo "PINNED SOURCE: $SHA"
              OUT=/cephfs/tessera_zarr_compare/$(date -u +%Y%m%dT%H%M%SZ)
              python3 scripts/compare_tessera_zarr.py \
                --data-dir /cephfs/unified_v2_512 \
                --n 20 \
                --cache-dir /cephfs/tessera_zarr_cache \
                --report "$OUT/report.json"
              echo "report: $OUT/report.json"
              echo "=== Done: $(date -u) ==="
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - { name: cephfs, mountPath: /cephfs }
      volumes:
        - name: cephfs
          persistentVolumeClaim: { claimName: training-data-cephfs }
