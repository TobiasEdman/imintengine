apiVersion: batch/v1
kind: Job
metadata:
  name: tradslag-pvc-load
  namespace: prithvi-training-default
  labels:
    app: ops
    purpose: tradslag-pvc-load
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ops
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: python:3.11-slim
          command:
            - bash
            - -c
            - |
              set -e
              mkdir -p /data/nmd2023_tradslag && cd /data/nmd2023_tradslag
              if [ -f TRADSLAG_DONE ]; then
                echo "NMD2023 raster already on PVC"; ls -la; exit 0
              fi
              apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null 2>&1
              echo "downloading NMD2023 Tradslag v1.1 (7.9G) ($(date))..."
              curl -sSL -o tradslag.zip "https://geodata.naturvardsverket.se/nedladdning/marktacke/NMD2023/Tillaggsskikt/NMD2023_Tradslag_v1_1.zip"
              echo "zip contents:"; unzip -l tradslag.zip | head -40
              echo "unzipping all rasters ($(date))..."
              # unzip exits 11 on an unmatched pattern (no .tfw in this zip) — tolerate it
              unzip -o -j tradslag.zip "*.tif" "*.aux.xml" "*.qml" -d . || [ $? -eq 11 ]
              rm -f tradslag.zip
              touch TRADSLAG_DONE
              echo "=== done ($(date)) ==="; ls -lh /data/nmd2023_tradslag/; df -h /data | tail -1
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: training-data-cephfs
