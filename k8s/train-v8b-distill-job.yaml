apiVersion: batch/v1
kind: Job
metadata:
  name: train-v8b-distill
  namespace: prithvi-training-default
  labels:
    app: unified-training
    purpose: v8b-distill
    dataset: "512"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: unified-training
        purpose: v8b-distill
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 43200   # RUN cap (from pod start, not queue) — Job-level counts queue time
      nodeSelector:
        accelerator: nvidia-h100
      # srv02's GPU admission is desynced (UnexpectedAdmissionError 2026-08-09,
      # 2 pods failed) — exclude it; the job queues until srv01/srv03 frees.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [p02r08srv02]
      containers:
        - name: trainer
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== Distill finetune — NFI-head pseudo-labels (28-class) — $(date) ==="
              echo "The core hypothesis: can a NMD2023-trained model beat NMD2023 on NFI field truth?"
              T=$(ls /cephfs/unified_v2_512/*.npz 2>/dev/null | wc -l)
              L=$(ls /cephfs/nmd2023_labels/*.npz 2>/dev/null | wc -l)
              echo "Tiles: $T | NMD2023 sidecar labels: $L"
              [ "$T" -lt 100 ] && { echo "ERROR: too few tiles"; exit 1; }
              [ "$L" -lt 100 ] && { echo "ERROR: NMD2023 sidecar labels missing"; exit 1; }

              apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
              pip install --quiet --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu121
              pip install --quiet --no-cache-dir timm numpy scipy scikit-learn huggingface_hub

              mkdir -p /cephfs/checkpoints/v8b_nmd2023_distill
              rm -f /cephfs/checkpoints/v8b_nmd2023_distill/*.pt.tmp 2>/dev/null || true

              mkdir -p /workspace && cd /workspace
              BRANCH=agent/te/opus/nfi-nmd2023-benchmark
              git clone --depth 1 --branch "$BRANCH" \
                https://github.com/TobiasEdman/ImintEngine.git imintengine
              cd /workspace/imintengine
              pip install --no-cache-dir -e . || pip install --quiet --no-cache-dir -r requirements.txt
              echo "CLONED $BRANCH HEAD: $(git rev-parse --short HEAD)"
              D=$(ls /cephfs/nmd2023_distill_labels/*.npz 2>/dev/null | wc -l)
              echo "distill sidecars: $D"; [ "$D" -lt 100 ] && { echo "FATAL: distill labels missing"; exit 1; }

              if [ -f /data/model_cache/Prithvi_EO_V2_600M_TL.pt ]; then
                ln -sf /data/model_cache/Prithvi_EO_V2_600M_TL.pt \
                  /workspace/imintengine/imint/fm/prithvi_mae/Prithvi_EO_V2_600M_TL.pt
                echo "Using cached Prithvi 600M weights"
              else
                echo "No cached 600M weights — downloading from HF"
              fi
              cd /cephfs

              # Identical regime to v8b (train-prithvi-600m-512) EXCEPT
              # --num-classes 28 + --label-dir (NMD2023 sidecar labels) +
              # Warm-start from the SATURATED v8b_nmd2023_long (0.4846); frac head cold-starts.
              python /workspace/imintengine/scripts/train_unified.py \
                --backbone-name prithvi_600m \
                --data-dirs /cephfs/unified_v2_512 \
                --label-dir /cephfs/nmd2023_distill_labels \
                --checkpoint-dir /cephfs/checkpoints/v8b_nmd2023_distill \
                --num-classes 28 \
                --warm-start-from /cephfs/checkpoints/v8b_nmd2023_long/best_model.pt \
                --enable-multitemporal \
                --num-temporal-frames 4 \
                --epochs 15 \
                --batch-size 2 \
                --lr 1e-4 \
                --weight-decay 0.35 \
                --unfreeze-layers 6 \
                --backbone-lr-factor 0.1 \
                --loss-type focal_dice \
                --focal-gamma 2.0 \
                --patch-size 504 \
                --img-size 504 \
                --weighting-method sqrt \
                --label-smoothing 0.05 \
                --lovasz-weight 0.3 \
                --patience 20 \
                --num-workers 16 \
                --device cuda
              echo "=== Done: $(date) ==="
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: "80Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cephfs
              mountPath: /cephfs
            - name: training-data
              mountPath: /data
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cephfs
          persistentVolumeClaim:
            claimName: training-data-cephfs
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
