---
# Step 3b of the 2024 campaign: targeted re-search of the five MGRS cells the
# first WEkEO prefetch (nfi2024-vpp-prefetch) could not fill for 2024.
#
# Recovered 2026-10-12 from the cluster (`kubectl get job nfi2024-vpp-retry5
# -o yaml`, uid 38f87996-f032-407f-9366-456d9073cce6); runtime fields
# stripped. It ran 2026-09-26T23:15:13Z for 2 min and exited non-zero on
# purpose: the gap report still listed 33UVC, 34WCS, 34WCT, 34WCU and 34WCV,
# which have NO HR-VPP product for any year (the cache stayed at 355 COGs).
# That result is what justified nfi2024-drop-uncovered (11 tiles, 45 plots).
#
# The script is byte-identical to nfi2024-vpp-prefetch-job.yaml: the retry is
# the same job re-run against the rewritten gap report, which is the design
# (the report is the single source of what is missing). It is kept as its own
# manifest because the run happened and its exit code is part of the record.
#
# Differences from the executed spec, both deliberate:
#   * image pinned to the digest the pod actually resolved for python:3.11-slim
#     that evening (status.containerStatuses[0].imageID), per the repo rule
#     that pipeline images are digest-pinned, never mutable tags;
#   * VPP_SOURCE / VPP_WEKEO_DIR added. prefetch_vpp_wekeo.py does not read
#     them (it talks to WEkEO HDA directly), but every manifest that touches
#     the VPP cache states the campaign invariant: cache-only, PU-free.
#
# PU-FREE. No DES, no CDSE. Do not resubmit: the five cells have no product.
apiVersion: batch/v1
kind: Job
metadata:
  name: nfi2024-vpp-retry5
  namespace: prithvi-training-default
  labels: {app: fieldtruth-prep, purpose: nfi2024-vpp}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: {app: fieldtruth-prep}
    spec:
      restartPolicy: Never
      containers:
        - name: prefetch
          image: python:3.11-slim@sha256:9358444059ed78e2975ada2c189f1c1a3144a5dab6f35bff8c981afb38946634
          command:
            - bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              echo "=== nfi2024 VPP prefetch (WEkEO, PU-free) — $(date -u) ==="
              apt-get update -qq && apt-get install -y -qq \
                git libgdal-dev gdal-bin > /dev/null 2>&1
              pip install -q --no-cache-dir \
                numpy rasterio pyproj requests hda 2>&1 | tail -2

              mkdir -p /workspace && cd /workspace
              git clone --depth 1 --branch main \
                https://github.com/TobiasEdman/ImintEngine.git ie
              cd /workspace/ie
              export PYTHONPATH=/workspace/ie:${PYTHONPATH:-}
              echo "CLONED main HEAD: $(git rev-parse --short HEAD)"

              MGRS=$(python3 -c "
              import json
              g = json.load(open('/data/manifests/nfi2024_vpp_gaps.json'))
              print(','.join(g['missing']))")
              N=$(echo "$MGRS" | tr ',' '\n' | grep -c . || true)
              echo "missing (MGRS, 2024) pairs to fetch: $N"
              if [ "$N" = "0" ]; then
                echo "cache already complete — nothing to do"
                exit 0
              fi

              python3 scripts/prefetch_vpp_wekeo.py \
                --mgrs-tiles "$MGRS" \
                --years 2024 \
                --dest-dir /data/vpp_wekeo

              echo ""
              echo "=== verify the gap actually closed ==="
              python3 - <<'PYEOF'
              import json
              import sys
              sys.path.insert(0, "scripts")
              from derive_missing_vpp_mgrs import cached_pairs
              gaps = json.load(open("/data/manifests/nfi2024_vpp_gaps.json"))
              have = cached_pairs("/data/vpp_wekeo")
              still = sorted(m for m in gaps["needed"] if (m, 2024) not in have)
              print(f"needed {len(gaps['needed'])}, still missing {len(still)}")
              if still:
                  # Not a failure of this job by itself — some MGRS cells may
                  # have no HR-VPP product for 2024 at all. But the fetch must
                  # not start believing the cache is whole, so the report is
                  # rewritten with the truth and this exits non-zero.
                  gaps["missing"] = still
                  json.dump(gaps, open("/data/manifests/nfi2024_vpp_gaps.json", "w"), indent=1)
                  sys.exit(f"STILL MISSING: {still}")
              gaps["missing"] = []
              json.dump(gaps, open("/data/manifests/nfi2024_vpp_gaps.json", "w"), indent=1)
              print("cache complete for 2024 — spectral fetch may start")
              PYEOF
              echo "=== done: $(date -u) ==="
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: VPP_SOURCE, value: "wekeo"}        # cache-only, fail-loud on miss
            - {name: VPP_WEKEO_DIR, value: "/data/vpp_wekeo"}
          envFrom:
            - secretRef: {name: wekeo-creds}   # WEKEO_USERNAME + WEKEO_PASSWORD
          resources:
            requests: {cpu: "4", memory: "16Gi"}
            limits: {cpu: "4", memory: "16Gi"}
          volumeMounts:
            - {name: training-data, mountPath: /data}
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-cephfs
