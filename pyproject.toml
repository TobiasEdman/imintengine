[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imint-engine"
version = "0.2.0"
description = "Reusable satellite data, analysis and model capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
fetch = [
  "rasterio>=1.3", "shapely>=2", "geopandas>=0.14", "fiona>=1.9",
  "pyproj>=3.6", "pyarrow>=14", "openeo>=0.20", "requests>=2.31",
  "xarray>=2024.7", "cftime>=1.6.4",
]
inference = [
  "torch>=2.1", "timm>=0.9", "einops>=0.7", "huggingface_hub>=0.20",
  "opencv-python-headless>=4.8", "scikit-image>=0.22", "matplotlib>=3.7",
]
training = [
  "imint-engine[fetch,inference]", "psutil>=5.9", "pandas>=2",
  "openpyxl>=3.1", "scikit-learn>=1.3",
]
api = [
  "imint-engine[fetch,inference]", "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<1", "gunicorn>=22,<24", "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "des-contracts==0.1.0",
]
atmosphere = ["imint-engine[fetch]", "cdsapi", "polytope-client"]
sr = ["imint-engine[inference]", "opensr-utils", "opensr-model", "opensr-test"]
viz = ["imint-engine[inference]", "svgpath2mpl>=0.2"]
dev = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
include = ["imint*"]
namespaces = false

[tool.setuptools.package-data]
imint = [
  "config/*.yaml", "fm/prithvi_mae/*.json", "fm/coastseg/*.json",
  "fm/pib_grazing/*/*/train_stats/*.pth", "fm/cot_models/*.pt",
  "fm/cot_models_l1c/*.npz",
  "analyzers/water_quality/aoi/*.geojson",
]
